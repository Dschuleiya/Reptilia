<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reptilia – Feedback</title>
<style>
:root{--bg:#0d1a14;--card:#15271e;--line:rgba(255,255,255,.1);--tx:#e8f2ec;--mut:#9db3a6;--acc:#5ee08f;--acc2:#ffc23d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0%,#1b3427 0%,var(--bg) 60%);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{font-weight:900;letter-spacing:.12em;color:var(--acc);font-size:13px}
.bar{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.cnt{font-size:12px;color:var(--mut);min-width:42px;text-align:right}
.sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--acc2);margin:8px 0 4px}
h1{font-size:22px;line-height:1.25;margin:0 0 6px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
main{flex:1;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);cursor:pointer;user-select:none;font-size:15px}
.opt .box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid #4b6a59;display:grid;place-items:center;font-size:14px;color:#0d1a14;font-weight:900}
.opt.radio .box{border-radius:50%}
.opt.on{border-color:var(--acc);background:#1c3a2a}
.opt.on .box{background:var(--acc);border-color:var(--acc)}
.rows{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.row .q{font-size:14.5px;margin-bottom:8px}
.seg{display:flex;gap:5px}
.seg button{flex:1;min-width:0;padding:9px 2px;border-radius:10px;border:1.5px solid var(--line);background:rgba(0,0,0,.2);color:var(--tx);font:600 13px system-ui;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#0d1a14}
.seg.small button{font-size:11.5px;padding:9px 1px}
.scale-l{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
textarea,input[type=text]{width:100%;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font:15px system-ui;padding:12px 14px;outline:none}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{border-color:var(--acc)}
.nav{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--bg) 35%)}
.btn{flex:1;padding:14px;border-radius:14px;border:0;font:800 16px system-ui;cursor:pointer;background:var(--acc);color:#0d1a14}
.btn.ghost{flex:0 0 auto;background:rgba(255,255,255,.08);color:var(--tx);padding:14px 18px}
.btn.gold{background:var(--acc2)}
.btn:disabled{opacity:.4}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mut);margin-bottom:10px}
.hero{text-align:center;padding:30px 0 10px}
.hero .big{font-size:64px;line-height:1}
.share{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.share .btn{flex:none}
pre{white-space:pre-wrap;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;max-height:220px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24402f;border:1px solid var(--acc);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const L5=['1','2','3','4','5'];
const FEAT=['Nicht entdeckt','Nicht genutzt','Unklar','Okay','Super'];
const Q=[
 {id:'intro',type:'intro'},
 {sec:'Allgemein',id:'name',type:'text',short:true,t:'Wie heißt du?',s:'Damit ich weiß, von wem das Feedback ist. Freiwillig.'},
 {sec:'Allgemein',id:'version',type:'text',short:true,t:'Welche Spielversion hast du gespielt?',s:'Steht im Spiel unter Menü ☰ ganz unten, z. B. „6.6“. Wenn du mehrere gespielt hast: die neueste.'},
 {sec:'Allgemein',id:'geraet',type:'multi',t:'Worauf hast du gespielt?',o:['Android-Handy','iPhone','Tablet','PC / Laptop']},
 {sec:'Allgemein',id:'dauer',type:'single',t:'Wie lange hast du ungefähr gespielt?',s:'Insgesamt, über alle Tage.',o:['Unter 30 Minuten','30 Minuten bis 2 Stunden','2 bis 5 Stunden','Mehr als 5 Stunden']},
 {sec:'Allgemein',id:'level',type:'text',short:true,num:true,t:'Welches Spieler-Level hast du erreicht?',s:'Steht oben links neben dem Logo.'},
 {sec:'Allgemein',id:'eindruck',type:'scale',t:'Wie sehr stimmst du zu?',s:'1 = gar nicht · 5 = voll und ganz',items:['Das Spiel macht mir Spaß.','Der Einstieg war leicht verständlich.','Ich wusste meistens, was ich als Nächstes tun kann.','Die Vererbung (dominant / rezessiv / het) habe ich verstanden.','Das Spieltempo (Brut- und Wachstumszeiten) passt.','Gold und Preise sind fair ausbalanciert.','Ich möchte weiterspielen.']},
 {sec:'Allgemein',id:'best',type:'text',t:'Was hat dir am besten gefallen?'},
 {sec:'Fehler & Probleme',id:'probleme',type:'multi',t:'Was davon ist dir passiert?',s:'Alles Zutreffende antippen – auch Kleinigkeiten.',o:['Ein Fehler / etwas hat nicht reagiert oder falsch funktioniert','Das Spiel hing, ruckelte oder war leer','Der Spielstand war weg oder unvollständig','Ich bin stecken geblieben und wusste nicht weiter','Ich hatte kein Gold mehr und kam nicht voran','Texte waren unklar, zu lang oder kompliziert','Etwas war zu klein, abgeschnitten oder schwer zu tippen','Nichts davon'],none:'Nichts davon'},
 {sec:'Fehler & Probleme',id:'wo',type:'multi',t:'Wo ist das passiert?',s:'Überspringen, wenn nichts passiert ist.',o:['Terrarium','Zucht / Inkubator','Schlupf-Anzeige','Markt / Aufträge','Messe','Saison','Atlas','Erfolge','Wiki / Hilfe','Menü'],skipIf:a=>!a.probleme||!a.probleme.length||a.probleme.includes('Nichts davon')},
 {sec:'Fehler & Probleme',id:'fehlertext',type:'text',t:'Was genau ist passiert?',s:'Was hast du getan, was hast du erwartet, was kam stattdessen? Screenshots kannst du gern separat schicken.',skipIf:a=>!a.probleme||!a.probleme.length||a.probleme.includes('Nichts davon')},
 {sec:'Fehler & Probleme',id:'unklar',type:'text',t:'Welche Begriffe oder Erklärungen waren unklar?',s:'z. B. „het“, „Qualität“, „Test-Verpaarung“ oder ein bestimmter Button.'},
 {sec:'Spielfunktionen',id:'features',type:'feat',t:'Welche Funktionen hast du genutzt?',s:'Pro Zeile ein Tipp. „Unklar“ = genutzt, aber nicht richtig verstanden.',items:['Aufträge','Markt / Kaufen & Verkaufen','Messe','Zuchtsaison','Zuchtberater','Het-Test-Verpaarung','DNA-Test','Persönliches Zuchtziel','Stammbaum','Qualität (Sterne) / Linienzucht','Atlas (Sammlung)','Erfolge','Geheime Erfolge & Hinweise','Genetik-Wiki','Zugelaufene Tiere / Tierheim','Favoriten, Filter & Sortierung','Terrarien ausbauen']},
 {sec:'Spielfunktionen',id:'arten',type:'single',t:'Wie viele Tierarten hast du freigeschaltet?',o:['1','2','3','4']},
 {sec:'Spielfunktionen',id:'vermissen',type:'text',short:true,t:'Welche Funktion würdest du am wenigsten vermissen?'},
 {sec:'Grafik & Sound',id:'grafik',type:'scale',t:'Wie sehr stimmst du zu?',s:'1 = gar nicht · 5 = voll und ganz',items:['Die Tiere sehen schön aus.','Ich erkenne die Morphs gut auseinander.','Ich sehe den Unterschied zwischen hoher und niedriger Qualität.','Die Bedienung ist übersichtlich.','Der Schlupf-Moment ist spannend.']},
 {sec:'Grafik & Sound',id:'sound',type:'single',t:'Wie findest du die Soundeffekte?',o:['Passen gut','Nerven mit der Zeit','Zu leise / zu laut','Hatte den Sound aus','Nicht bemerkt']},
 {sec:'Grafik & Sound',id:'optik',type:'text',t:'Was sollte optisch oder akustisch anders sein?'},
 {sec:'Ziele & Motivation',id:'antrieb',type:'multi',max:3,t:'Was hat dich am meisten angetrieben?',s:'Bis zu 3 auswählen.',o:['Neue Morphs entdecken, Atlas füllen','Seltene Mutationen','Tiere mit möglichst vielen Sternen züchten','Gold verdienen, Terrarien ausbauen','Erfolge (auch geheime) freischalten','Messe-Medaillen und Saison-Belohnungen','Ein Lieblingstier / Traum-Morph','Die Genetik verstehen und knobeln']},
 {sec:'Ziele & Motivation',id:'ziel',type:'text',short:true,t:'Welches Ziel hast du dir selbst gesetzt?',s:'z. B. ein bestimmter Morph oder Erfolg.'},
 {sec:'Ziele & Motivation',id:'stopp',type:'single',t:'Warum hast du (vorerst) aufgehört?',o:['Ich spiele noch','Keine Zeit','Zu langsam / zu viel Warten','Wusste nicht weiter','Wurde eintönig','Anderer Grund']},
 {sec:'Verbesserungen',id:'wuensche',type:'multi',t:'Was würdest du dir wünschen?',s:'Alles, was dich reizt.',o:['Mit Freunden per Code vernetzen','Tiere tauschen, verschenken oder zur Paarung ausleihen','Ranglisten (Saison, Atlas, Messe)','Als App auf dem Handy installieren','Spielstand online, auf mehreren Geräten','Mehr Tierarten','Terrarien einrichten / dekorieren','Besseres Tutorial für den Einstieg','Kürzere Wartezeiten','Längere, anspruchsvollere Ziele']},
 {sec:'Verbesserungen',id:'klein',type:'text',t:'Kleine Dinge',s:'Was nervt, was sollte anders benannt, verschoben oder vereinfacht werden?'},
 {sec:'Verbesserungen',id:'gross',type:'text',t:'Große Dinge',s:'Wenn du eine Sache am Spiel ändern oder hinzufügen dürftest – was wäre das?'},
 {sec:'Verbesserungen',id:'nps',type:'nps',t:'Wie wahrscheinlich würdest du Reptilia einem Freund empfehlen?',s:'0 = gar nicht · 10 = auf jeden Fall'},
 {sec:'Verbesserungen',id:'sonst',type:'text',t:'Sonst noch etwas?'},
 {id:'done',type:'done'}
];
const KEY='reptilia_feedback_v1';
let A={},cur=0;
try{const d=JSON.parse(localStorage.getItem(KEY));if(d){A=d.A||{};cur=d.cur||0}}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({A,cur}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const visible=i=>!(Q[i].skipIf&&Q[i].skipIf(A));
const realQ=Q.filter(q=>q.type!=='intro'&&q.type!=='done');
function step(d){let i=cur+d;while(i>0&&i<Q.length-1&&!visible(i))i+=d;cur=Math.max(0,Math.min(Q.length-1,i));persist();render();scrollTo(0,0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}

function render(){
  const q=Q[cur],app=$('#app');
  const qi=realQ.indexOf(q),pct=q.type==='done'?100:q.type==='intro'?0:Math.round(qi/realQ.length*100);
  let h=`<div class="top"><div class="logo">REPTILIA</div><div class="bar"><i style="width:${pct}%"></i></div><div class="cnt">${qi>=0?(qi+1)+'/'+realQ.length:''}</div></div><main>`;
  if(q.type==='intro'){
    h+=`<div class="hero"><div class="big">🦎</div></div><h1>Danke fürs Testen von Reptilia!</h1>
    <div class="sub">Ein paar kurze Fragen, ca. 5–10 Minuten. Fast alles nur antippen – jede Frage kannst du auch überspringen.<br><br>Am Ende kannst du mir das Ergebnis mit einem Tipp per WhatsApp, Mail o. Ä. schicken. Deine Antworten bleiben zwischengespeichert, falls du zwischendurch abbrichst.</div>`;
  }else if(q.type==='done'){
    const txt=resultText();
    h+=`<div class="hero"><div class="big">🎉</div></div><h1>Geschafft – vielen Dank!</h1>
    <div class="sub">Schick mir jetzt bitte dein Ergebnis. Am einfachsten über „Teilen“ und dann WhatsApp, Signal oder Mail auswählen.</div>
    <div class="share">${navigator.share?'<button class="btn" data-a="share">📤 Ergebnis teilen</button>':''}
    <button class="btn ${navigator.share?'ghost':''}" data-a="wa">💬 Per WhatsApp senden</button>
    <button class="btn ghost" data-a="mail">✉️ Per E-Mail senden</button>
    <button class="btn ghost" data-a="copy">📋 Text kopieren</button></div>
    <div class="hint" style="margin-top:16px">Vorschau deines Ergebnisses:</div><pre id="res">${esc(txt)}</pre>`;
  }else{
    h+=`<div class="sec">${q.sec}</div><h1>${q.t}</h1>${q.s?`<div class="sub">${q.s}</div>`:''}`;
    const v=A[q.id];
    if(q.type==='single'||q.type==='multi'){
      h+=`<div class="opts">${q.o.map((o,i)=>{const on=q.type==='single'?v===o:(v||[]).includes(o);return`<div class="opt ${q.type==='single'?'radio':''} ${on?'on':''}" data-a="opt" data-i="${i}"><span class="box">${on&&q.type==='multi'?'✓':''}</span><span>${o}</span></div>`}).join('')}</div>`;
    }else if(q.type==='text'){
      h+=q.short?`<input type="text" id="tx" ${q.num?'inputmode="numeric"':''} value="${esc(v||'')}" placeholder="Antwort …">`:`<textarea id="tx" placeholder="Antwort …">${esc(v||'')}</textarea>`;
    }else if(q.type==='scale'||q.type==='feat'){
      const labs=q.type==='scale'?L5:FEAT;
      if(q.type==='feat')h+=`<div class="leg">Antippen, was am besten passt.</div>`;
      h+=`<div class="rows">${q.items.map((it,r)=>`<div class="row"><div class="q">${it}</div><div class="seg ${q.type==='feat'?'small':''}">${labs.map((l,c)=>`<button class="${v&&v[r]===c?'on':''}" data-a="cell" data-r="${r}" data-c="${c}">${l}</button>`).join('')}</div>${q.type==='scale'?'<div class="scale-l"><span>gar nicht</span><span>voll und ganz</span></div>':''}</div>`).join('')}</div>`;
    }else if(q.type==='nps'){
      h+=`<div class="seg" style="flex-wrap:wrap">${[...Array(11)].map((_,i)=>`<button style="flex:0 0 calc(16.66% - 5px)" class="${v===i?'on':''}" data-a="nps" data-i="${i}">${i}</button>`).join('')}</div>`;
    }
  }
  h+=`</main><div class="nav">`;
  if(q.type==='intro')h+=`<button class="btn" data-a="next">Los geht’s →</button>`;
  else if(q.type==='done')h+=`<button class="btn ghost" data-a="back">← Antworten ändern</button>`;
  else{const answered=has(q);h+=`<button class="btn ghost" data-a="back">←</button><button class="btn ${cur===Q.length-2?'gold':''}" data-a="next">${cur===Q.length-2?'Fertig ✓':answered?'Weiter →':'Überspringen →'}</button>`}
  h+=`</div>`;
  app.innerHTML=h;
  const tx=$('#tx');if(tx){tx.oninput=()=>{A[q.id]=tx.value;persist();updNext()}}
}
function has(q){const v=A[q.id];if(v==null)return false;if(Array.isArray(v))return v.some(x=>x!=null&&x!=='');return String(v).trim()!==''}
function updNext(){const q=Q[cur],b=document.querySelector('[data-a=next]');if(b&&cur!==Q.length-2)b.textContent=has(q)?'Weiter →':'Überspringen →'}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,q=Q[cur];
  if(a==='next')step(1);else if(a==='back')step(-1);
  else if(a==='opt'){const o=q.o[+el.dataset.i];
    if(q.type==='single'){A[q.id]=A[q.id]===o?undefined:o;persist();render();if(A[q.id])setTimeout(()=>step(1),260);return}
    let v=(A[q.id]||[]).slice();
    if(v.includes(o))v=v.filter(x=>x!==o);else{
      if(q.none&&o===q.none)v=[o];else{v=v.filter(x=>x!==q.none);if(q.max&&v.length>=q.max){toast('Höchstens '+q.max+' auswählen');return}v.push(o)}}
    A[q.id]=v;persist();render()}
  else if(a==='cell'){const r=+el.dataset.r,c=+el.dataset.c,v=(A[q.id]||[]).slice();v[r]=v[r]===c?null:c;A[q.id]=v;persist();render()}
  else if(a==='nps'){const i=+el.dataset.i;A[q.id]=A[q.id]===i?undefined:i;persist();render()}
  else if(a==='share'){navigator.share({title:'Reptilia-Feedback',text:resultText()}).catch(()=>{})}
  else if(a==='wa'){openUrl('https://wa.me/?text='+encodeURIComponent(resultText()))}
  else if(a==='mail'){openUrl('mailto:?subject='+encodeURIComponent('Reptilia-Feedback'+(A.name?' von '+A.name:''))+'&body='+encodeURIComponent(resultText()))}
  else if(a==='copy'){copy(resultText())}
});
function openUrl(u){const w=window.open(u,'_blank');if(!w){try{location.href=u}catch(e){copy(resultText(),true)}}}
function copy(t,fallback){
  let ok=false;const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(e){}ta.remove();
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('📋 Kopiert – jetzt in WhatsApp o. Ä. einfügen')).catch(()=>toast(ok?'📋 Kopiert':'Bitte Text unten markieren und kopieren'));
  else toast(ok?'📋 Kopiert – jetzt einfügen':'Bitte Text unten markieren und kopieren');
}
function resultText(){
  const out=['🦎 Reptilia-Feedback'+(A.name?' von '+A.name:'')];let n=0;
  const secs={};Q.forEach((q,i)=>{if(!q.sec||q.id==='name'||!visible(i))return;const v=A[q.id],L=[];const t=q.t.replace(/[?.]$/,'');
    if(q.type==='scale'||q.type==='feat'){const rows=q.items.map((it,r)=>{const c=v&&v[r];return c==null?null:'• '+it.replace(/\.$/,'')+': '+(q.type==='scale'?(c+1)+'/5':FEAT[c])}).filter(Boolean);if(rows.length)L.push(...(q.type==='feat'?['Funktionen:']:[]),...rows)}
    else if(q.type==='multi'){if(v&&v.length)L.push(t+': '+v.join(', '))}
    else if(q.type==='nps'){if(v!=null)L.push('Weiterempfehlung: '+v+'/10')}
    else if(v&&String(v).trim())L.push(t+': '+String(v).trim());
    if(L.length){n++;(secs[q.sec]=secs[q.sec]||[]).push(...L)}});
  for(const k in secs)out.push('','— '+k.toUpperCase()+' —',...secs[k]);
  if(!n)out.push('','(keine Antworten)');
  return out.join('\n');
}
render();
</script>
</body>
</html>
