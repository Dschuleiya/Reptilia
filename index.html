<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07130e">
<title>Reptilia – Zuchtstation</title>
<style>
:root{--bg:#07130e;--panel:rgba(255,255,255,.055);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--txt:#eaf3ed;--mut:#9cb2a6;--acc:#f6b93b;--acc2:#3ddc97;--bad:#ff6b6b;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(1100px 600px at 50% -15%,#1f4430 0%,transparent 60%),radial-gradient(700px 500px at 110% 110%,#10303a 0%,transparent 60%),radial-gradient(600px 400px at -10% 70%,#2a2412 0%,transparent 60%),#07130e;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;position:relative}
header{padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,rgba(7,19,14,.95),rgba(7,19,14,.75));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5}
.logo{font-weight:900;letter-spacing:.12em;font-size:17px;background:linear-gradient(90deg,#9ef0c4,#f6d26b);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.logo small{display:block;font-size:11px;letter-spacing:.3em;color:var(--mut);-webkit-text-fill-color:var(--mut);margin-top:3px}
.lvl{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.lvlb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:conic-gradient(var(--acc2) calc(var(--x)*1%),rgba(255,255,255,.12) 0);position:relative;flex:none}
.lvlb::before{content:"";position:absolute;inset:3px;border-radius:50%;background:#0d1f17}
.lvlb span{position:relative}
.xpt{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coins{display:flex;align-items:center;gap:5px;padding:7px 10px;flex:none;border-radius:999px;background:rgba(246,185,59,.12);border:1px solid rgba(246,185,59,.35);font-weight:800;color:#ffd77a;transition:transform .15s}
.coins.pop{transform:scale(1.15)}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
nav{display:flex;padding:6px 8px calc(6px + var(--safe-b));gap:6px;background:rgba(6,16,12,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:14px;font-size:11px;color:var(--mut);position:relative;font-weight:600}
nav button i{font-style:normal;font-size:22px;line-height:1;transition:transform .2s}
nav button.on{color:#fff;background:linear-gradient(180deg,rgba(61,220,151,.18),rgba(61,220,151,.04))}
nav button.on i{transform:translateY(-2px) scale(1.1)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px #07130e;animation:bump 1.6s infinite}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 4px 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h2 .sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}
.row{display:flex;align-items:center;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.chip.on{background:#e9f7ef;color:#0b1f15;border-color:#e9f7ef}
.chip.lock{opacity:.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border-radius:14px;font-weight:800;background:var(--panel2);border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(180deg,#45e3a0,#20b377);color:#05261a;border:0;box-shadow:0 6px 18px rgba(61,220,151,.25)}
.btn.gold{background:linear-gradient(180deg,#ffd36e,#f0a92a);color:#3a2300;border:0;box-shadow:0 6px 18px rgba(246,185,59,.25)}
.btn.red{background:rgba(255,107,107,.14);color:#ffb0b0;border-color:rgba(255,107,107,.35)}
.btn.armed{background:var(--bad);color:#fff}
.btn[disabled],.btn.dis{opacity:.38;pointer-events:none;filter:grayscale(.6)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mgh{position:sticky;top:-12px;z-index:3;display:flex;align-items:center;gap:8px;margin:0 -12px 8px;padding:10px 16px;background:rgba(9,22,16,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:inset 4px 0 0 var(--rc)}
.mgn{flex:1;font-weight:900;font-size:14px;color:var(--rc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgc{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}
.mgg{margin-bottom:14px}
.qst{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.qst span{font-size:11.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--mut);white-space:nowrap}.qst span.hi{background:rgba(246,185,59,.16);color:#ffd36e;font-weight:800}
.qsel{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;background:#10241a;color:var(--txt);border:1px solid var(--line);font:inherit;font-weight:700;font-size:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;transition:transform .1s}
.card:active{transform:scale(.97)}
.card::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 55%,transparent)}
.cimg{aspect-ratio:4/3;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%),linear-gradient(180deg,#1a2e22,#0f1d16);display:grid;place-items:center;position:relative}
.cimg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--rc) 40%,transparent))}
.rtag{position:absolute;top:7px;left:7px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.45);color:var(--rc);border:1px solid color-mix(in srgb,var(--rc) 50%,transparent)}
.ftag{position:absolute;top:6px;right:8px;font-size:15px;color:#ffd36e}
.cinfo{padding:8px 10px 10px}
.cname{font-weight:800;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.cname b{overflow:hidden;text-overflow:ellipsis}
.sex{font-size:13px;font-weight:900}.sex.m{color:#6cc0ff}.sex.f{color:#ff8fc8}
.cmorph{font-size:12px;color:#d7e6dc;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.chet{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.cstat{font-size:11px;margin-top:6px;color:var(--mut);display:flex;align-items:center;gap:6px}
.pb{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#9ef0c4);width:0;border-radius:3px}
.ok{color:var(--acc2);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:30px 16px;line-height:1.5}
.empty .big{font-size:44px;display:block;margin-bottom:6px}
.goal{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(90deg,rgba(246,185,59,.16),rgba(246,185,59,.04));border:1px solid rgba(246,185,59,.3);margin-bottom:12px}
.goal .gi{font-size:22px}
.goal .gt{flex:1;font-size:13px;line-height:1.3}
.goal .gt small{display:block;color:#ffd77a;font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.goal .gr{font-size:12px;font-weight:800;color:#ffd77a;white-space:nowrap}
/* pairing */
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}
.slot{border:2px dashed rgba(255,255,255,.18);border-radius:16px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;color:var(--mut);font-size:12px;background:rgba(0,0,0,.15);position:relative;overflow:hidden}
.slot.filled{border-style:solid;border-color:color-mix(in srgb,var(--rc) 60%,transparent);background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 18%,transparent),rgba(0,0,0,.2) 70%);color:var(--txt)}
.slot img{width:100%;max-width:150px;aspect-ratio:4/3;object-fit:contain}
.slot .sx{font-size:30px;font-weight:900}
.slot .sn{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .sm2{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.heart{font-size:26px;animation:beat 1.2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.pred{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border-radius:12px;background:rgba(0,0,0,.18)}
.prow img{width:52px;height:39px;object-fit:contain;flex:none}
.prow .pn{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn small{display:block;font-weight:600;font-size:11px}
.prow .pp{font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.newt{font-size:11px;font-weight:900;padding:2px 6px;border-radius:6px;background:#ff6fb5;color:#fff;letter-spacing:.06em;margin-left:4px;vertical-align:1px}
.hint{font-size:12px;color:var(--mut);line-height:1.45}
.newchance{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(255,111,181,.1);border:1px solid rgba(255,111,181,.3);color:#ffc2e0;font-weight:700}
.tog{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(160,120,255,.1);border:1px solid rgba(160,120,255,.3);margin-top:10px;font-size:13px}
.tog .sw{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on .sw{background:#a078ff}.tog.on .sw::after{left:21px}
/* eggs */
.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.eggs{grid-template-columns:repeat(5,1fr)}}
.eggc{border-radius:16px;background:radial-gradient(circle at 50% 40%,rgba(255,170,80,.14),rgba(0,0,0,.2) 70%);border:1px solid var(--line);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.eggc.ready{border-color:rgba(61,220,151,.6);background:radial-gradient(circle at 50% 40%,rgba(61,220,151,.28),rgba(0,0,0,.2) 70%)}
.eggc.ready .egg{animation:wob 1.4s infinite}
.eggc .et{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:700}
.eggc.ready .et{color:var(--acc2)}
.ering{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffb454 calc(var(--p,0)*1%),rgba(255,255,255,.08) 0)}
.eggc.ready .ering{background:conic-gradient(#3ddc97 100%,#3ddc97 0)}
.ering>div{width:60px;height:60px;border-radius:50%;background:#0e1d16;display:grid;place-items:center}
.egg{width:30px;height:38px;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;background:radial-gradient(circle at 35% 28%,#fffdf6,#efe5cf 55%,#c9bb98);box-shadow:inset -4px -5px 9px rgba(0,0,0,.18)}
.egg.sp-gecko{width:26px;height:34px}
.egg.sp-snake{width:32px;height:42px;background:radial-gradient(circle at 35% 28%,#fffaf0,#efe2c6 55%,#c7b48a)}
.egg.sp-corn{width:28px;height:39px;background:radial-gradient(circle at 35% 28%,#fffaf2,#f1e6d0 55%,#cdb994)}
.egg.sp-turtle{width:34px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffffff,#eceae4 55%,#bdb8ab)}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
/* sheet */
#sheetwrap{position:fixed;inset:0;z-index:40;display:none}
#sheetwrap.show{display:block}
#sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:90%;overflow-y:auto;background:linear-gradient(180deg,#14281e,#0b1812);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:8px 16px calc(20px + var(--safe-b));animation:up .28s cubic-bezier(.2,.9,.3,1.1);overscroll-behavior:contain}
#sheet .grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:4px auto 10px}
#sheet .x{position:absolute;right:12px;top:10px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.sh-title{font-size:20px;font-weight:900;margin:2px 44px 2px 0}
.sh-sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.bigimg{border-radius:18px;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 25%,transparent),transparent 65%),linear-gradient(180deg,#1d3427,#0e1c15 70%,#2b2417);aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden;margin:6px 0 12px}
.bigimg::before{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 6px,transparent 6px 13px),linear-gradient(180deg,transparent,rgba(120,90,50,.25))}
.bigimg img{width:100%;height:100%;object-fit:contain;position:relative;animation:breathe 3.5s ease-in-out infinite;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--rc) 45%,transparent))}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025) translateY(-1px)}}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip{padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12.5px;font-weight:700}
.gchip small{display:block;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.04em}
.gchip.vis{background:rgba(61,220,151,.13);border-color:rgba(61,220,151,.4)}
.gchip.mut{background:rgba(255,111,181,.15);border-color:rgba(255,111,181,.5)}
.gchip.het{background:rgba(108,192,255,.12);border-color:rgba(108,192,255,.4);color:#bfe3ff}
.gchip.pos{background:rgba(108,192,255,.06);border-color:rgba(108,192,255,.25);color:#a3c7e4}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv>div{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--mut)}
.kv b{display:block;color:var(--txt);font-size:15px;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .full{grid-column:1/-1}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.li img{width:72px;height:54px;object-fit:contain;flex:none;border-radius:10px;background:rgba(0,0,0,.25)}
.li .lt{flex:1;min-width:0}
.li .lt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lt b span{display:inline;font-size:inherit;color:inherit}
.li.dis{opacity:.45}
/* market */
.trend{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(90deg,rgba(108,192,255,.18),rgba(108,192,255,.04));border:1px solid rgba(108,192,255,.35);font-size:13px;margin-bottom:4px}
.trend b{color:#bfe3ff}
.order{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.order .oi{font-size:30px;width:48px;height:48px;border-radius:14px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
.order .ot{flex:1;min-width:0}
.order .ot small{color:var(--mut);font-size:11px;display:block}
.order .ot b{font-size:14px;display:block;margin:2px 0}
.order .ot .rw{font-size:12px;color:#ffd77a;font-weight:800}
.order.can{border-color:rgba(61,220,151,.55);background:linear-gradient(90deg,rgba(61,220,151,.12),rgba(255,255,255,.03))}
.offer .price{font-weight:900;color:#ffd77a;font-size:14px}
.upg{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.upg .ui{font-size:26px;width:48px;height:48px;border-radius:14px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
.upg .ut{flex:1;min-width:0}
.upg .ut b{display:block;font-size:14px}
.upg .ut span{font-size:12px;color:var(--mut);display:block}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.pips i.on{background:var(--acc2)}
/* atlas */
.prog{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ff6fb5,#f6b93b,#3ddc97);border-radius:5px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.agrid{grid-template-columns:repeat(5,1fr)}}
.acell{border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);overflow:hidden;position:relative}
.acell .aimg{aspect-ratio:4/3;display:grid;place-items:center;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%)}
.acell img{width:100%;height:100%;object-fit:contain}
.acell .an{font-size:11px;font-weight:700;padding:4px 6px 6px;line-height:1.2;min-height:30px;color:#dbe8df}
.acell.lock .aimg{color:rgba(255,255,255,.18);font-size:28px;font-weight:900;background:repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 8px,transparent 8px 16px)}
.acell.lock .an{color:rgba(255,255,255,.3)}
.acell .num{position:absolute;top:4px;left:6px;font-size:11px;color:rgba(255,255,255,.35);font-weight:800}
.named{display:flex;flex-wrap:wrap;gap:6px}
.nm{padding:6px 10px;border-radius:10px;font-size:12px;font-weight:800;background:rgba(255,255,255,.05);border:1px solid var(--line);color:rgba(255,255,255,.35)}
.nm.on{background:linear-gradient(90deg,rgba(246,185,59,.25),rgba(255,111,181,.18));border-color:rgba(246,185,59,.5);color:#ffe3a3}
.ach{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}

<body>
<div id="app">
  <header>
    <div class="logo">REPTILIA<small>ZUCHTSTATION</small></div>

    <div class="coins" id="coins">🪙 <span>0</span></div>
    <button class="ibtn" data-act="mail" aria-label="Postfach" style="position:relative">📬<b id="mbadge" class="mbadge"></b></button><button class="ibtn" data-act="menu" aria-label="Menü">☰</button>
  </header>
  <main id="view"></main>
  <nav id="nav">
    <button data-act="tab" data-t="tiere"><i>🦎</i>Terrarien</button>

  </nav>
</div>
<div id="sheetwrap"><div id="sheetbg" data-act="closesheet" aria-hidden="true"></div><div id="sheet" role="dialog" aria-modal="true" aria-label="Fenster"></div></div>
<div id="reveal"></div>

<script>
'use strict';
/* ================= Absturz-Schutz (7.6) – läuft vor allem anderen, ohne Zugriff auf S ================= */
var BOOTED=false,RESCUE=false;
const ERR_KEY='reptilia_errlog';
function logErr(e,where){try{let L=[];try{L=JSON.parse(localStorage.getItem(ERR_KEY))||[]}catch(x){}if(!Array.isArray(L))L=[];let ver='?';try{ver=VERSION}catch(x){}
  const m=e&&e.message?e.message:String(e);L.push({t:Date.now(),v:ver,w:String(where||''),m:String(m).slice(0,400),s:e&&e.stack?String(e.stack).slice(0,900):''});while(L.length>10)L.shift();localStorage.setItem(ERR_KEY,JSON.stringify(L))}catch(x){}}
window.onerror=function(msg,src,line,col,err){logErr(err||new Error(String(msg)),'Fehler '+(line||'?')+':'+(col||'?'));if(!BOOTED&&!RESCUE)setTimeout(function(){if(!BOOTED&&!RESCUE)rescueScreen(err||new Error(String(msg)))},0)};
window.addEventListener('unhandledrejection',function(e){logErr(e&&e.reason||new Error('Promise abgelehnt'),'Promise')});
function errReport(withState){let L=[];try{L=JSON.parse(localStorage.getItem(ERR_KEY))||[]}catch(e){}if(!Array.isArray(L))L=[];let ver='?',sch='?';try{ver=VERSION}catch(e){}try{sch=SCHEMA}catch(e){}
  const out=['Reptilia – Fehlerbericht','Version: '+ver+' · Schema: '+sch,'Zeit: '+new Date().toLocaleString('de-DE'),'Gerät: '+navigator.userAgent,'Adresse: '+String(location.href).split('?')[0]];
  if(withState){try{out.push('Stand: Level '+S.lvl+', '+S.animals.length+' Tiere, '+Math.floor(S.coins)+' Münzen, Tutorial: '+(S.tut?(S.tut.replay?'Erinnerung ':'')+S.tut.s:'fertig'))}catch(e){}}
  out.push('',L.length?'Letzte Fehler ('+L.length+', neueste zuerst):':'Keine Fehler protokolliert.');
  L.slice().reverse().forEach((x,i)=>{out.push('#'+(i+1)+' '+new Date(x.t).toLocaleString('de-DE')+' · v'+x.v+' · '+x.w,'  '+x.m);if(x.s)out.push('  '+String(x.s).split('\n').slice(0,5).join('\n  '))});
  return out.join('\n')}
function copyText(t){return new Promise(res=>{let ok=false;try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);ok=document.execCommand('copy');ta.remove()}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>res(true),()=>res(ok));else res(ok)})}
/* Notfall-Bildschirm: reines DOM, liest nur localStorage, fasst S nicht an */
function rescueScreen(err,test){RESCUE=true;
  const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const K='reptilia_save_v2',KB=K+'_bak',KM=K+'_bak_meta',KX=K+'_broken';
  let ver='?';try{ver=VERSION}catch(e){}
  let raw=null,bak=null,bakT=null,bakOk=false;try{raw=localStorage.getItem(K)}catch(e){}
  try{bak=localStorage.getItem(KB);const m=JSON.parse(localStorage.getItem(KM)||'null');if(m&&m.t)bakT=m.t}catch(e){}
  if(bak!=null){try{const d=JSON.parse(bak);try{bakOk=!validateSave(d)}catch(e){bakOk=true}}catch(e){bakOk=false}}
  const msg=(err&&err.message)||String(err||'Unbekannter Fehler');
  ['sheetwrap','reveal','coach','coachm','passive','savewarn','alfab'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display='none'});
  const old=document.getElementById('rescue');if(old)old.remove();
  const home=String(location.href).split('?')[0].split('#')[0];
  const box=document.createElement('div');box.id='rescue';
  box.innerHTML=`<div class="rs"><div style="font-size:44px">🛟</div><h1>Reptilia – Notfall-Modus</h1>
   <div>${test?'<b>Testansicht.</b> So sieht der Notfall-Bildschirm aus. Dein Spielstand ist in Ordnung.':'Beim Start ist ein Fehler aufgetreten. <b>Dein Spielstand wurde nicht verändert und nicht überschrieben.</b> Sichere ihn jetzt als Code, bevor du etwas anderes tust.'}</div>
   <div style="font-size:13px;color:#b3c7bb">Version ${E(ver)} · Spielstand im Speicher: ${raw==null?'keiner':E(Math.round(raw.length/1024)+' KB')}</div>
   <pre>${E(msg)}</pre>
   <button class="btn wide" id="rs-copy" ${raw==null?'disabled':''}>📋 Rohdaten als Sicherungscode kopieren</button>
   <textarea id="rs-code" readonly style="display:none"></textarea>
   <button class="btn wide" id="rs-bak" ${bak!=null&&bakOk?'':'disabled'}>♻️ Letzte Sicherung laden${bakT?' (vom '+E(new Date(bakT).toLocaleString('de-DE'))+')':''}</button>
   ${bak==null?'<div style="font-size:12px;color:#b3c7bb">Es gibt noch keine automatische Sicherung.</div>':bakOk?'':'<div style="font-size:12px;color:#ffb0b0">Die automatische Sicherung ist ebenfalls beschädigt.</div>'}
   <button class="btn wide" id="rs-err">🐞 Fehlerbericht kopieren</button>
   <button class="btn wide" id="rs-reload">🔄 Nochmal versuchen</button>
   ${test?`<button class="btn pri wide" id="rs-home">↩️ Zurück zum Spiel</button>`:''}
   <button class="btn red wide" id="rs-new">🗑️ Neu beginnen</button>
   <div class="rst" id="rs-st"></div>
   <div style="font-size:12px;color:#b3c7bb">Tipp: Schick den Sicherungscode und den Fehlerbericht an die Entwicklerin. Beim Laden der Sicherung und beim Neubeginn wird der jetzige Stand zusätzlich beiseitegelegt.</div></div>`;
  document.body.appendChild(box);
  const $r=id=>box.querySelector('#'+id),st=t=>{$r('rs-st').textContent=t};
  const stash=()=>{if(raw==null)return;try{localStorage.setItem(KX,raw)}catch(e){}};

function gotoAch(id,cat){S.tab='atlas';S.ui.asub='ach';S.ui.achcat=cat||'Allgemein';closeSheet();render();setTimeout(()=>{const el=document.querySelector(`[data-ach="${id}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2600)}},60)}

const SEASON_LEN=7*864e5,STIERS_F=[.08,.2,.34,.5,.68,.85,1];
const seasonMax=()=>S.season?S.season.tasks.reduce((t,x)=>t+x.pts,0):360;

function seasonReward(i){const f=1+S.lvl*.3;return[{c:Math.round(120*f/5)*5},{e:1},{c:Math.round(300*f/5)*5},{e:2},{an:2},{c:Math.round(800*f/5)*5},{an:3}][i]}
const rwText=r=>r.c?fmt(r.c)+' 🪙':r.e?r.e+'× 🧪 Elixier':r.an===2?'🎁 Seltenes Tier':'🎁 Legendäres Tier';
function genSeason(){const sps=unlocked(),T=[];const add=(k,n,pts,x)=>T.push(Object.assign({k,n,pts,prog:0},x||{}));
  const left=sps.reduce((t,sp)=>t+COMBOS[sp].filter(x=>!hiddenMut(sp,x)).length-atlasCount(sp),0),qt=S.lvl>=6?4:3.5;
  add('hatch',70,25);add('breed',25,20);if(left>=4)add('new',Math.max(3,Math.min(12,Math.round(left*.35))),30);add('orders',10,25);add('sell',35,15);add('super',4,25);add('combo3',5,30);add('quality',4,30,{q:qt});
  if(S.lvl>=2)add('medal',3,30);if(S.lvl>=3)add('named',4,30);
  sps.forEach(sp=>{const g=pick(SPECIES[sp].genes.filter(x=>!x.mut));add('gene',6,20,{sp,gene:g.id})});
  add('hatchsp',20,20,{sp:pick(sps)});
  const now=Date.now();S.season={start:now,end:now+SEASON_LEN,tasks:T,claimed:[]}}
function taskLabel(t){switch(t.k){case'hatch':return`Lass ${t.n} Tiere schlüpfen`;case'breed':return`Verpaare ${t.n}-mal`;case'new':return`Entdecke ${t.n} neue Morphs`;case'orders':return`Erfülle ${t.n} Aufträge`;case'sell':return`Verkaufe ${t.n} Tiere`;case'candle':return`Durchleuchte ${t.n} Eier`;case'dna':return`Mach ${t.n} DNA-Tests`;case'super':return`Züchte ${t.n} Super-Formen`;case'combo3':return`Züchte ${t.n} Tiere mit 3+ Merkmalen`;case'quality':return`Züchte ${t.n} Tiere mit ★ ${fq(t.q||3.5)} oder mehr`;case'medal':return`Gewinne ${t.n} Messe-Medaillen`;case'named':return`Züchte ${t.n} benannte Morphs`;case'gene':return`Züchte ${t.n}× sichtbar ${geneOf(t.sp,t.gene).name} (${SPECIES[t.sp].icon})`;case'hatchsp':return`Lass ${t.n} ${SPECIES[t.sp].plural} schlüpfen`}return t.k}
const seasonPts=()=>S.season?S.season.tasks.reduce((t,x)=>t+(x.prog>=x.n?x.pts:0),0):0;
function track(ev,a){const se=S.season;if(!se)return;se.tasks.forEach(t=>{if(t.prog>=t.n)return;let ok=false;
  if(ev==='hatch'){const sts=states(a);ok=t.k==='hatch'||(t.k==='super'&&sts.includes(2))||(t.k==='combo3'&&traitCount(sts)>=3)||(t.k==='quality'&&(a.q||2)>=(t.q||3.5)-1e-9)||(t.k==='named'&&!!namedOf(a.sp,sts))||(t.k==='gene'&&a.sp===t.sp&&st(a,geneOf(a.sp,t.gene))>0)||(t.k==='hatchsp'&&a.sp===t.sp)}
  else ok=({breed:'breed',atlas:'new',order:'orders',sell:'sell',candle:'candle',dna:'dna',medal:'medal'})[ev]===t.k;
  if(ok){t.prog++;if(t.prog>=t.n){toast(`🏅 Saisonaufgabe erledigt: <b>${taskLabel(t)}</b> +${t.pts} Pkt.`,'gold',3200);snd('rare')}}})}

function seasonAnimal(n){const sps=unlocked().filter(sp=>!full(sp));if(!sps.length)return null;const sp=pick(sps),def=SPECIES[sp],g={};shuffle(def.genes.filter(x=>!x.mut)).slice(0,n).forEach(x=>{g[x.id]=x.type==='rec'?2:x.type==='codom'?ri(1,2):1});const a=newAnimal(sp,{g,adult:true,q:+(n>=3?3.3+rand()*.9:2.8+rand()*.8).toFixed(1)});S.animals.push(a);registerAtlas(a);geneToast(a);return a}

    S.gifts=Array.isArray(S.gifts)?S.gifts:[];S.gifts.push({n:r.an,t:Date.now()});mail('🎁','Saison-Belohnung wartet auf dich','Deine Terrarien waren voll – tippen, um das Tier abzuholen, sobald Platz ist.','gift');S.season.claimed.push(i);seasonFullCheck();return true}toast(`🎁 ${esc(a.name)}: <b>${morphName(a.sp,states(a))}</b> ★ ${fq(a.q)} zieht ein!`,'gold',4000);mail('🎁','Saison-Belohnung',`${esc(a.name)} (${morphName(a.sp,states(a))}, ★ ${fq(a.q)}) ist eingezogen.`,'saison')}else if(r.c){S.coins+=r.c;S.stats.earned+=r.c;mail('🎁','Saison-Belohnung',`+${fmt(r.c)} 🪙`,'saison')}else{S.items.elixir+=r.e;mail('🎁','Saison-Belohnung',`+${r.e} 🧪 Mutations-Elixier`,'saison')}S.season.claimed.push(i);seasonFullCheck();return true}

  const line=e=>`${fmtWhen(e.t)} · ${fmtPlay(e.pm)} · ${e.x} · ${fmt(e.c)}/${e.h}/${e.a}`;
  let body=L.map(line),txt=head.concat(body).join('\n');if(!L.length)txt=head.concat(['(noch keine Einträge)']).join('\n');

function genOffer(){
  const sps=unlocked(),w=sps.map((sp,i)=>1+i*1.5);let r=rand()*w.reduce((a,b)=>a+b),sp=sps[0];for(let i=0;i<sps.length;i++){r-=w[i];if(r<=0){sp=sps[i];break}}
  const def=SPECIES[sp],base=def.genes.filter(g=>!g.mut),recs=base.filter(g=>g.type==='rec'),doms=base.filter(g=>g.type!=='rec'),g={},p={};let wild=false;const x=rand();
  if(x<.32){const ge=pick(recs);g[ge.id]=1;p[ge.id]=1}
  else if(x<.52){wild=true;recs.forEach(ge=>{if(rand()<.16)g[ge.id]=1;p[ge.id]=.16})}
  else if(x<.86){const ge=pick(doms);g[ge.id]=1;if(rand()<.3){const r2=pick(recs);g[r2.id]=1;p[r2.id]=1}}
  else{const ge=pick(recs);g[ge.id]=2}
  if(S.lvl>=6&&rand()<.18){const ge=pick(doms);g[ge.id]=Math.max(g[ge.id]||0,1)}
  const a=newAnimal(sp,{g,p,wild,adult:true,q:+(1.3+rand()*1.3+(S.lvl>=6&&rand()<.2?1:0)).toFixed(1)});a.price=Math.round(value(a)*1.45/5)*5;return a}

function genOrder(){

const TLIM_RESET=new Set(['filter','sort','fsex','fstat','gf','freset','tab','fopen']),SHLIM_RESET=new Set(['mgf','msort','mready','mq','mfav','mreset','sasp','sam']);
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,f=ACT[act];if(f){e.preventDefault();if(S&&S.ui&&TLIM_RESET.has(act))S.ui.tlim=LIMSTEP;if(SHLIM_RESET.has(act))SHLIM=LIMSTEP;if(S&&BOOTED)markDirty();f(el.dataset,el);if(PENDING_VIEW&&BOOTED&&!viewBusy()){PENDING_VIEW=false;render()}}});

const dnaCost=a=>Math.round((300+SPECIES[a.sp].basePrice*5)/10)*10;
const upgCost=k=>{const u=UPG[k],l=S.upg[k];return Math.round((u.poly?u.base*Math.pow(l+1,u.poly):u.base*Math.pow(u.mult,l))/5)*5};
const rushCost=e=>Math.max(3,Math.ceil((e.ready-Date.now())/1000/3));

function canBreed(m,f){if(!m||!f)return'Tier fehlt';if(!isAdult(m)||!isAdult(f))return'wächst noch';if(Date.now()<f.restUntil)return'♀ erholt sich';return''}
const breedCost=sp=>Math.round(SPECIES[sp].basePrice*.6/5)*5;
function inbred(m,f){const mp=m.parents||[],fp=f.parents||[];if(mp.includes(f.id)||fp.includes(m.id))return'Elternteil × Kind';if(mp.some(x=>fp.includes(x)))return mp.length&&mp.every(x=>fp.includes(x))?'Geschwister':'Halbgeschwister';return''}
function doBreed(m,f,extra){const def=SPECIES[m.sp],free=eggSlots()-S.eggs.length;if(free<1)return-1;if(!spend(breedCost(m.sp)))return-2;if((m.parents||[]).includes(f.id)||(f.parents||[]).includes(m.id))S.stats.familyBreed=1;if((m.parents||[]).some(x=>(f.parents||[]).includes(x)))S.stats.sibBreed=1;let n=ri(def.clutch[0],def.clutch[1]);if(rand()<S.upg.clutch*.15)n++;n=Math.min(n,free);const ca=crysAct();for(let i=0;i<n;i++)S.eggs.push(makeEgg(m,f,extra));if(ca){S.crys.used=(S.crys.used||0)+1;if(!crysLeft())setTimeout(()=>toast('😴 Der Kristall ist erschöpft und lädt sich bis morgen wieder auf.','warn',3800),400)}f.restUntil=Date.now()+def.rest*1000;S.stats.bred++;track('breed');addXP(4);return n}
function breed(el){
  const m=byId(S.pair.m),f=byId(S.pair.f);const why=canBreed(m,f);if(why){toast(why,'warn');return}
  if(eggSlots()-S.eggs.length<1){toast('🥚 Inkubator voll – lass erst Eier schlüpfen','warn');snd('err');return}
  const extra=S.ui.elixir&&S.items.elixir>0?.15:0;if(extra){S.items.elixir--;S.ui.elixir=false}
  const n=doBreed(m,f,extra);if(n<0){if(extra)S.items.elixir++;return}if(S.eggs.length>=eggSlots())S.stats.fullIncub=1;
  snd('love');confetti(28,null,null,['#ff6fb5','#ff9ccf','#ffd1e6']);
  toast(`💞 ${esc(m.name)} × ${esc(f.name)}: <b>${n} Ei${n>1?'er':''}</b> im Inkubator`+(extra?' 🧪':''));
  after();render();
}
function breedAll(){let eggs=0,cnt=0,stop=false;for(const p of S.pairs){const m=byId(p.m),f=byId(p.f);if(canBreed(m,f))continue;const n=doBreed(m,f,0);if(n<0){stop=n;break}eggs+=n;cnt++}if(S.eggs.length>=eggSlots())S.stats.fullIncub=1;
  if(!cnt){if(stop!==-2)toast(stop?'🥚 Inkubator voll':'Kein Zuchtpaar ist gerade bereit','warn');return}
  snd('love');confetti(40,null,null,['#ff6fb5','#ff9ccf','#ffd1e6']);toast(`💞 ${cnt} Paar${cnt>1?'e':''} verpaart: <b>${eggs} Eier</b> im Inkubator`+(stop?' · Inkubator jetzt voll':''));after();render()}

function pickMate(sex){const sp=S.pair.sp,now=Date.now();S.ui.mf=S.ui.mf||{};const mf=S.ui.mf[sp]||{},so=S.ui.msort||'q',onlyOk=!!S.ui.mready,q35=!!S.ui.mq,mfav=!!S.ui.mfav;

function geneLook(g,v){let t=g.info.replace(/^Mutation: /,'');t=t.charAt(0).toUpperCase()+t.slice(1);if(v===2&&g.type==='codom'&&SUPER_LOOK[g.name])return SUPER_LOOK[g.name];const i=t.indexOf('Doppelt:');if(i<0)return t;const a=t.slice(0,i).trim(),b=t.slice(i+8).trim();return v===2?b.charAt(0).toUpperCase()+b.slice(1).replace(/\.$/,'')+' – noch stärker als mit einer Kopie ('+a.replace(/\.$/,'')+').':a}

  SPECIES[sp].genes.forEach((g,i)=>{const v=s[i];if(!v||used[g.id]!==undefined)return;L.push(`<li><b>${traitLabel(g,v)}:</b> ${geneLook(g,v)}</li>`)});

function wikiReal(W){return`
  ${W('✅','Was das Spiel richtig macht',`<p>Die Mendelsche Verteilung, die Het-Wahrscheinlichkeiten (50 % / 66 %), Testverpaarungen, Super-Formen und die echten Kombinamen (Raptor, Bumblebee, Snow …) entsprechen der Wirklichkeit. Was du hier über Vererbung lernst, gilt auch bei echten Tieren.</p>`,true)}
  ${W('🐢','Schmuckschildkröten dürfen in der EU nicht gezüchtet werden',`<p>Die Schmuckschildkröte steht seit dem 3. August 2016 auf der EU-Liste invasiver Arten. Zucht, Handel und Aussetzen sind verboten; ältere Tiere dürfen bleiben. Im Spiel kannst du sie trotzdem züchten – das ist reine Fantasie. Setz echte Schildkröten niemals aus!</p>${wSrc(['hlnug','nrw'])}`)}
  ${W('🖤','Der „Melanist“ ist eigentlich kein Gen',`<p>Im Spiel ist Melanist ein dominantes Gen. In echt werden viele Schmuckschildkröten-Männchen erst mit 6–11 Jahren schwarz – ein Alterseffekt, der nicht so vererbt wird.</p>${wSrc(['jabl'])}`)}
  ${W('⚠️','Manche Morphs machen echte Tiere krank',`<p>Im Spiel haben alle Morphs dieselbe Gesundheit. In echt sind manche Farbformen mit Leiden verknüpft:</p><p>• <b>Spider</b> (und Bumblebee, Killer Bee): Gleichgewichtsstörung durch verformtes Innenohr – von Tierärzten als Qualzucht eingestuft.<br>• <b>Enigma</b>: Gleichgewichtsstörungen, Kreisdrehen – von der DGHT als Qualzucht eingestuft.<br>• <b>Super Snow</b>: verkürzter Schädel – mögliche Qualzucht.<br>• <b>Albinos</b>: lichtempfindlich, Augenprobleme möglich.</p><p>Mehr dazu unter ⚖️ Tierwohl.</p>${wSrc(['btk','dghtm'])}`)}
  ${W('🔧','Vereinfachungen im Spiel',`<p>• <b>Ko-dominant</b> heißt fachlich „unvollständig dominant“.<br>• <b>Ultra und Amel</b> liegen bei Kornnattern am selben Genort; im Spiel sind es zwei Gene.<br>• <b>Lavender Albino</b> ist beim Königspython ein einzelnes Gen.<br>• <b>Albino-Linien:</b> Leopardgeckos haben drei verschiedene Albino-Gene, im Spiel gibt es nur eins.<br>• <b>Geschlecht:</b> Im Spiel Zufall – bei Geckos und Schildkröten entscheidet in echt die Bruttemperatur.<br>• <b>Gelegegrößen:</b> Echte Kornnattern legen 10–30 Eier, Pythons 4–15 – im Spiel weniger, damit die Terrarien nicht überlaufen.<br>• <b>Qualität ★:</b> eine vereinfachte Zusammenfassung vieler kleiner Erbanlagen.<br>• <b>Inzucht</b> hat im Spiel keine Nachteile – in echt reichern sich dabei schädliche Erbanlagen an.</p>`)}
  ${W('☄️','Erfundene Mutationen',`<p>Alle ☄️-Mutationen (Galaxie, Glut, Kristall, Lavendel, Jade, Mondstein, Opal, Nebel) und der grüne Kristall sind Spiel-Erfindungen. Nebel ist an den echten Kornnatter-Morph „Lavender“ angelehnt.</p>`)}`}

  ${W('⚖️','Qualzucht (§ 11b Tierschutzgesetz)',`<p>In Deutschland ist es verboten, Tiere so zu züchten, dass die Nachkommen wegen ihrer Gene Schmerzen haben, leiden oder Schäden tragen. Eine schöne Farbe ist kein „vernünftiger Grund“, der das erlaubt.</p>${wSrc(['lgl','cirs'])}`,true)}
  ${W('🩺','Wie Tierärzte die Spiel-Morphs einstufen',`<table class="gtab wt"><tr><td><b>Morph</b></td><td><b>Einstufung</b></td></tr><tr><td>Spider (+ Bumblebee, Killer Bee)</td><td>Qualzucht (Bundestierärztekammer, DGHT)</td></tr><tr><td>Enigma</td><td>Qualzucht (DGHT); in der Schweiz Zuchtverbot</td></tr><tr><td>Super Snow</td><td>mögliche Qualzucht (DGHT)</td></tr><tr><td>Albino</td><td>auffällig: Lichtempfindlichkeit, Augenprobleme</td></tr><tr><td>Lavender (Vorbild für Nebel)</td><td>mögliche Qualzucht (DGHT)</td></tr></table><p class="hint">Die Studienlage ist dünn; vieles beruht auf Halterberichten (DGHT, 2026).</p>${wSrc(['btk','dghtm'])}`)}
  ${W('🛂','Artenschutz',`<table class="gtab wt"><tr><td><b>Königspython</b></td><td>CITES Anhang II: Herkunftsnachweis Pflicht, keine Meldepflicht</td></tr><tr><td><b>Schmuckschildkröte</b></td><td>EU-Liste invasiver Arten: Zucht, Handel, Aussetzen verboten</td></tr><tr><td><b>Leopardgecko, Kornnatter</b></td><td>nicht geschützt</td></tr></table><p>Ob eine Art geschützt ist, zeigt die Datenbank WISIA des Bundesamts für Naturschutz.</p>${wSrc(['dort','hlnug','rpbw'])}`)}

function vWiki(){const W=(ic,t,body,open)=>`<details class="wk" ${open?'open':''}><summary>${ic} ${t}</summary><div class="txt">${body}</div></details>`;
  const sec=S.ui.wsec||'gen',secs=[['gen','🧬 Genetik'],['arten','🦎 Tierarten'],['real','🌍 Spiel vs. Realität'],['tier','⚖️ Tierwohl'],['gloss','📖 Glossar'],['src','🔗 Quellen']];
  const nav=`<div class="chips" style="margin-bottom:10px">${secs.map(([v,l])=>`<button class="chip sm ${sec===v?'on':''}" data-act="wsec" data-v="${v}">${l}</button>`).join('')}</div>`;
  let body;
  if(sec==='arten'){const sp=S.ui.wsp&&WIKI_SP[S.ui.wsp]?S.ui.wsp:'gecko';body=`<div class="chips" style="margin-bottom:10px">${SP_ORDER.map(x=>`<button class="chip sm ${x===sp?'on':''}" data-act="wsp" data-v="${x}">${SPECIES[x].icon} ${SPECIES[x].name}</button>`).join('')}</div>${wikiSp(sp)}`}
  else if(sec==='real')body=wikiReal(W);
  else if(sec==='tier')body=wikiTier(W);
  else if(sec==='gloss')body=`<div class="panel"><table class="gtab wt">${WIKI_GLOSS.map(([t,d])=>`<tr><td><b>${t}</b></td><td>${d}</td></tr>`).join('')}</table></div>`;
  else if(sec==='src')body=`<div class="panel"><p class="hint" style="margin-top:0">Alle Fakten im Wiki stammen aus diesen Quellen (Stand November 2026). Wo nur Züchterwissen vorliegt, steht das im Text.</p><div class="wsrcs">${Object.keys(WSRC).map(k=>`<a class="wsrc" href="${WSRC[k][1]}" target="_blank" rel="noopener">📄 ${WSRC[k][0]} ↗</a>`).join('')}</div><div class="flab">Bildnachweise</div>${SP_ORDER.map(sp=>{const im=WIKI_SP[sp].img;return`<p class="hint">${SPECIES[sp].icon} Foto: ${im[1]}, <a href="${im[3]}" target="_blank" rel="noopener">${im[2]}</a>, <a href="${im[4]}" target="_blank" rel="noopener">Wikimedia Commons</a></p>`}).join('')}</div>`;
  else body=wikiGen(W);
  return`<div class="panel" style="margin-bottom:10px"><b>📚 Wiki</b><div class="hint" style="margin-top:4px">Genetik, echte Tiere und was das Spiel vereinfacht – mit Quellen zum Weiterlesen.</div></div>${nav}${body}`}
function wikiGen(W){
  const genesOf=type=>SP_ORDER.map(sp=>SPECIES[sp].genes.filter(g=>g.type===type&&(!g.mut||S.mutSeen[g.id])).map(g=>SPECIES[sp].icon+' '+g.name+(g.mut?' ☄️':'')).join(', ')).filter(Boolean).join(' · ');
  return`${W('🧬','Grundbegriffe',`<p>Ein <b>Gen</b> ist ein Bauplan-Abschnitt, z. B. für die Farbe. Jedes Tier besitzt jedes Gen <b>zweimal</b> – eine Kopie von der Mutter, eine vom Vater. Die Varianten eines Gens heißen <b>Allele</b>.</p><p><b>Genotyp</b> = welche Allele ein Tier trägt. <b>Phänotyp</b> = wie es aussieht. Ein <b>Morph</b> ist eine gezüchtete Farb- oder Musterform.</p><p><b>Homozygot</b>: beide Kopien gleich. <b>Heterozygot</b> (kurz <b>het</b>): zwei verschiedene Kopien.</p><p>Bei jeder Verpaarung gibt jedes Elternteil <b>zufällig eine</b> seiner zwei Kopien weiter – 50:50. Alle Kombinationen zeigt das <b>Punnett-Quadrat</b>: oben die Allele des einen Elternteils, links die des anderen, in den Feldern die möglichen Jungtiere. Jedes Feld hat dieselbe Wahrscheinlichkeit (hier je 25 %).</p><p class="hint">Schreibweise: <b>+</b> = normales Wildtyp-Allel, Buchstaben = Mutations-Allel.</p>`,true)}
  ${W('📜','Die Mendelschen Regeln',`<p>Gregor Mendel fand die Grundregeln der Vererbung um 1865 mit über 10.000 Erbsen-Kreuzungen; um 1900 wurden sie wiederentdeckt.</p><p><b>1. Uniformitätsregel:</b> Kreuzt man zwei reinerbige Eltern, die sich in einem Merkmal unterscheiden, sehen alle Kinder gleich aus.<br><b>2. Spaltungsregel:</b> Kreuzt man diese Kinder untereinander, spaltet die nächste Generation wieder auf – bei rezessiven Merkmalen 3 : 1.<br><b>3. Unabhängigkeitsregel:</b> Verschiedene Gene werden unabhängig voneinander vererbt – außer sie liegen eng beieinander auf demselben Chromosom (Kopplung).</p><p><b>Wahrscheinlichkeit ist kein Versprechen:</b> 25 % heißt nicht „eins von vier Eiern“. Jedes Ei ist ein neuer Zufallswurf – ein Gelege kann null oder vier Albinos enthalten.</p>${wSrc(['spmen','spall'])}`)}
  ${W('🔴','Rezessiver Erbgang',`<p>Das Merkmal ist nur <b>sichtbar, wenn beide Kopien</b> es tragen (aa). Mit einer Kopie (+a) sieht das Tier normal aus, vererbt es aber – es ist <b>het</b>.</p><p><b>het × het</b> (beide sehen normal aus!):</p>${pun(['+','a'],['+','a'],recC)}<p>→ <b>25 % sichtbar</b>, 50 % het, 25 % normal.</p><p><b>Weitere Kombinationen:</b><br>sichtbar × normal → 100 % het (alle normal aussehend)<br>sichtbar × het → 50 % sichtbar, 50 % het<br>sichtbar × sichtbar → 100 % sichtbar<br>het × normal → 50 % het, 50 % normal – <i>kein</i> sichtbares Tier</p><p class="hint">Im Spiel rezessiv: ${genesOf('rec')}</p>`)}
  ${W('🎲','%-Hets: Warum 66 %?',`<p>Bei het × het sehen 3 von 4 Jungtieren normal aus. Davon sind <b>2 het</b> und nur 1 wirklich normal. Ein normal aussehendes Jungtier ist also zu <b>2/3 ≈ 66 %</b> het.</p><p>Aus het × normal sind alle Jungtiere normal aussehend, aber jedes nur zu <b>50 %</b> het.</p><p>Gewissheit bekommst du so:</p><p>• <b>Testverpaarung</b> ist der Weg der Züchter: günstig, aber braucht Zeit.<br>• <b>DNA-Test</b> zeigt die echten Gene sofort – ist aber sehr teuer (500+ 🪙).<br>• <b>Testverpaarung</b>: Bekommt ein Tier sichtbaren Nachwuchs, ist es sicher het – das Spiel markiert die Eltern dann automatisch und rechnet das neue Wissen im ganzen Stammbaum weiter: Geschwister, Nachkommen und Großeltern bekommen aktualisierte %-Werte.<br>• Wildfänge können völlig unbekannte Hets tragen – Überraschungen möglich!</p>`)}
  ${W('🟢','Dominanter Erbgang',`<p>Schon <b>eine Kopie</b> reicht, damit das Merkmal sichtbar ist. Zwei Kopien sehen genauso aus (im Spiel als „homozygot“ gekennzeichnet).</p><p><b>Dominant (D+) × normal (++)</b>:</p>${pun(['D','+'],['+','+'],domC)}<p>→ <b>50 % sichtbar</b>. Ein homozygotes Tier (DD) gibt das Merkmal an <b>100 %</b> seiner Jungen weiter.</p><p class="hint">Im Spiel dominant: ${genesOf('dom')}</p>`)}
  ${W('✨','Ko-dominanter Erbgang & Super-Formen',`<p>Eine Kopie ist sichtbar, <b>zwei Kopien</b> erzeugen eine eigene, stärkere Form: die <b>Super-Form</b>.</p><p><b>einfach × einfach</b> (z. B. Pastel × Pastel):</p>${pun(['S','+'],['S','+'],coC)}<p>→ 25 % Super, 50 % einfach, 25 % normal.</p><p>Super × normal → 100 % einfach · Super × einfach → 50 % Super, 50 % einfach · Super × Super → 100 % Super.</p><p><b>Fachbegriff:</b> In der Reptilienszene heißen solche Gene „ko-dominant“. Korrekt ist <b>unvollständig dominant</b>: Das mischerbige Tier ist eine Zwischenform. Echte Ko-Dominanz heißt, dass beide Allele nebeneinander sichtbar sind – wie bei der Blutgruppe AB.</p><p class="hint">Im Spiel ko-dominant: ${genesOf('codom')}</p>${wSrc(['scit'])}`)}

function ringTopic(k){if(k==='letter')return'Ein Brief mit einer Überraschung';if(k.startsWith('sp:'))return'Alles über die '+SPECIES[k.slice(3)].plural;if(k.startsWith('feat:')){const F=FEATCALL[k.slice(5)];return F?F.hook.split(/[!:]/)[0]:k}const L=LESSON[k.replace(/^lesson:/,'')];return L?L.t.replace(/^\S+\s/,''):k}

  const s=sig();if(s!==lastSig){const prevReady=+lastSig.split(',')[0]||0,ready=S.eggs.filter(e=>now>=e.ready).length;if(lastSig&&ready>prevReady){toast(`🐣 ${ready-prevReady>1?(ready-prevReady)+' Eier sind':'Ein Ei ist'} bereit zum Schlüpfen!`);snd('tap')}lastSig=s;changed=true}

function tEggTarget(pid){const E=tEggs(pid).sort((a,b)=>a.ready-b.ready);if(!E.length)return null;if(S.tab!=='brut')return NAVT('brut');const r=E.find(e=>Date.now()>=e.ready)||E[0];return`[data-act="egg"][data-id="${r.id}"]`}
function tPetHTML(a,sub){return`<div class="tut-pet"><img src="${aImg(a,240,180)}"><div><b><span class="sex ${a.sex}">${a.sex==='m'?'♂':'♀'}</span> ${esc(a.name)}</b><span>${sub}</span></div></div>`}
function punnett(dad,mom,cell,note){const c=(x,y)=>{const r=cell(x,y);return`<td class="${r.v?'pv':''}"><b>${x}${y}</b><small>${r.t}</small></td>`};
  return`<table class="punnett"><tr><th>♂ \\ ♀</th><th>${mom[0]}</th><th>${mom[1]}</th></tr>${dad.map(d=>`<tr><th>${d}</th>${c(d,mom[0])}${c(d,mom[1])}</tr>`).join('')}</table><div class="hint" style="text-align:center">${LV('So liest du die Tabelle: Jedes Junge bekommt eine Kopie vom Vater (Zeile) und eine von der Mutter (Spalte). Jedes der 4 Felder ist gleich wahrscheinlich.','Kreuzungsquadrat (Punnett-Quadrat): Allele des Vaters in den Zeilen, der Mutter in den Spalten – jedes Feld hat 25 %.','Punnett-Quadrat, je Feld 25 %.')} <b>+</b> = normale Kopie.${note?'<br>'+note:''}</div>`}
const typeLine=(k)=>({
  rec:LV('zeigt sich nur, wenn <b>beide</b> Kopien es tragen. Mit nur einer bleibt es unsichtbar – das Tier ist dann ein heimlicher Träger, kurz „<b>het</b>“.','zeigt sich nur mit <b>zwei</b> Kopien (<i>homozygot</i>). Mit einer bleibt es verdeckt – das Tier ist <i>heterozygot</i>, kurz „<b>het</b>“.','Phänotyp nur bei Homozygotie; Heterozygote heißen in der Szene „<b>het</b>“.'),
  dom:LV('schon <b>eine</b> Kopie reicht, damit man es sieht.','schon <b>eine</b> Kopie reicht (auch <i>heterozygot</i> sichtbar).','bereits heterozygot sichtbar.'),
  codom:LV('eine Kopie zeigt es, <b>zwei</b> Kopien ergeben eine stärkere <b>Super</b>-Form.','eine Kopie zeigt es, zwei (<i>homozygot</i>) ergeben die <b>Super</b>-Form.','unvollständig dominant (Szene: „ko-dominant“): heterozygot = Grundform, homozygot = Super-Form.')})[k];
/* ---------- Lektionen (Tutorial + Telefon) ---------- */
const LESSON={
 genes:{t:'🧬 Gene & Erbgänge',f:t=>({html:LV('<p>Stell dir jedes Gen wie ein Rezept für ein Merkmal vor – etwa für die Augenfarbe. <b>Jedes Tier hat jedes Rezept zweimal</b>: eine Kopie von der Mutter, eine vom Vater. Welche seiner zwei Kopien ein Elternteil weitergibt, ist Zufall – wie ein Münzwurf.</p>','<p>Jedes Tier hat jedes Gen <b>doppelt</b> – eine Kopie von der Mutter, eine vom Vater. Die Varianten eines Gens heißen <b>Allele</b>. Welches Allel ein Elternteil weitergibt, ist Zufall – 50 : 50, ganz nach Mendel.</p>','<p>Kurz und knapp: diploid, ein Allel je Elternteil, Weitergabe zufällig 50 : 50. Drei Erbgänge im Spiel:</p>')+
   `<div class="tut-types">${[['rec','Rezessiv','Albino, Eclipse'],['dom','Dominant','Enigma'],['codom','Ko-dominant','Mack Snow']].map(([k,n,ex])=>`<div class="${t&&k===t.type?'on':''}"><b class="tt t-${k}">${n}</b> ${typeLine(k)} <span class="hint">z. B. ${ex}</span>${t&&k===t.type?` <i>← ${t.name}</i>`:''}</div>`).join('')}</div>`,
   more:'<p><b>Genotyp und Phänotyp:</b> Der <i>Genotyp</i> ist, was in einem Tier <b>steckt</b>, der <i>Phänotyp</i>, wie es <b>aussieht</b>. Bei rezessiven Genen fällt beides auseinander: Ein Gecko kann ganz normal aussehen und trotzdem Albino in sich tragen.</p><p><b>Der Münzwurf:</b> Ein het-Albino-Tier hat eine normale und eine Albino-Kopie. Für jedes Ei wird neu „geworfen“, welche weitergeht. Erst wenn <b>beide</b> Eltern zufällig ihre Albino-Kopie abgeben, schlüpft ein Albino.</p><p><b>Darum überspringen rezessive Merkmale oft eine Generation:</b> Die Kinder sind nur Träger – erst bei den Enkeln taucht das Merkmal wieder auf.</p><p><b>Und Super-Formen?</b> Bekommt ein Junges bei einem ko-dominanten Gen von <b>beiden</b> Eltern die Kopie, entsteht die Super-Form – bei Mack Snow die schwarz-weiße Super Snow.</p>'})},
 het:{t:'🔎 het: sicher oder vielleicht?',f:()=>({html:`<p>Auf den Steckbriefen siehst du zwei Arten von het-Angaben:</p><div class="tut-types"><div><b>✓ het Albino</b> (ohne Prozent) = <b>gesichert</b>. Das Tier trägt die Kopie ganz sicher – zum Beispiel, weil Mutter oder Vater Albino <i>zeigt</i> und jedes Junge zwangsläufig eine Albino-Kopie bekommt.</div><div><b>❓ 50 % het Eclipse</b> = <b>vielleicht</b>. Wie bei Rudi: Niemand weiß es genau. Mit 50 % Wahrscheinlichkeit trägt er die Kopie, mit 50 % nicht.</div></div><p>Im Filter heißt das eine „<b>het</b>“, das andere „<b>möglich het</b>“.</p>`,
   more:'<p><b>Woher kommen die Prozente?</b> Sie werden von Generation zu Generation weitergerechnet. Ist Rudi zu 50 % het, gibt er die Eclipse-Kopie – <i>falls</i> er sie hat – nur an jedes zweite Junge weiter. Seine Kinder (mit einem Partner ohne Eclipse) sind darum nur zu 25 % het.</p><p><b>Wie wird aus „vielleicht“ „sicher“?</b> Per Test-Verpaarung mit einem Tier, das das Merkmal <i>zeigt</i>: Ein einziges sichtbares Junges beweist das Gen – dann springt die Angabe auf ✓. Bleiben die Jungen unauffällig, sinkt die Prozentzahl Schritt für Schritt.</p><p><b>Ganz sicher geht es nur per DNA-Test</b> – der ist aber teuer.</p>'})},
 p66:{t:'🎲 Warum 66 % het?',f:()=>({html:`<p>Manchmal steht bei einem Tier „<b>66 % het</b>“. Das kommt von zwei <b>sicher het</b> Eltern:</p>`+punnett(['+','a'],['+','a'],(x,y)=>x==='a'&&y==='a'?{t:'Albino',v:1}:x==='a'||y==='a'?{t:'normal · het',v:0}:{t:'normal',v:0})+`<p>Eins von vier Feldern ist Albino (25 %). Die anderen <b>drei</b> sehen normal aus – aber <b>zwei</b> davon tragen das Gen. Bei einem normal aussehenden Jungen sind es also <b>2 von 3 = 66 %</b>.</p>`,
   more:'<p><b>Warum nicht 50 %?</b> Weil wir etwas schon wissen: Das Junge sieht normal aus. Damit fällt das Albino-Feld (aa) weg – übrig bleiben nur die drei normalen Felder, und davon sind zwei het. Mathematiker nennen das eine <i>bedingte Wahrscheinlichkeit</i>.</p><p><b>Und 50 % het?</b> Entstehen, wenn nur <b>ein</b> Elternteil sicher het ist und der andere das Gen gar nicht hat: Dann ist jedes Junge mit 50 % Chance Träger.</p>'})},
 test:{t:'🧪 Test-Verpaarung',f:()=>({html:'<p>Ob ein Tier ein rezessives Gen verdeckt trägt, siehst du ihm nicht an. Also verpaarst du es mit einem Partner, der das Merkmal <b>zeigt</b> (zwei Kopien).</p><p><b>Schlüpft ein einziges sichtbares Junges, ist es bewiesen:</b> Eine Kopie kam vom sichtbaren Partner, die zweite <i>muss</i> vom Testtier stammen.</p><p>Bleiben alle Jungen unauffällig, ist het nur <b>unwahrscheinlicher</b> – ausschließen kann man es per Verpaarung nie ganz.</p>',
   more:'<p><b>Wie viele Junge brauche ich?</b> Ist das Testtier wirklich het, zeigt jedes Junge das Merkmal mit 50 %. Dass trotzdem drei Junge hintereinander normal aussehen, passiert noch in 1 von 8 Fällen (12,5 %). Nach sechs unauffälligen Jungen sind es nur noch 1,6 %.</p><p>Der <b>🎯 Zuchtberater</b> (Reiter Het-Test) rechnet dir das automatisch aus und schlägt passende Testpartner vor.</p>'})},
 dom:{t:'🧬 Reinerbig oder mischerbig?',f:()=>({html:'<p>Bei <b>dominanten</b> Genen wie Enigma reicht eine Kopie, damit man das Merkmal sieht. Ein Enigma-Tier kann also <b>eine</b> Kopie haben (mischerbig) oder <b>zwei</b> (reinerbig) – von außen sieht man keinen Unterschied.</p><p>Reinerbige Tiere geben das Merkmal an <b>alle</b> Jungen weiter, mischerbige nur an etwa die Hälfte. Deshalb zeigt das Spiel z. B. „33 % reinerbig Enigma“, wenn beide Eltern Enigma waren.</p><p><b>So testest du es:</b> Verpaare das Tier mit einem Partner <b>ohne</b> das Merkmal. Schlüpft auch nur ein Junges ohne Enigma, ist bewiesen: mischerbig. Zeigen alle Jungen Enigma, wird „reinerbig“ immer wahrscheinlicher.</p>',
   more:'<p>Das ist die klassische <b>Rückkreuzung</b> (Testkreuzung) aus dem Biounterricht – nur andersherum als beim het-Test: Dort beweist ein sichtbares Junges ein verstecktes Gen, hier beweist ein <i>unsichtbares</i> Junges die fehlende zweite Kopie.</p><p>Ist das Tier mischerbig, zeigt jedes Junge das Merkmal nur mit 50 %. Fünf sichtbare Junge hintereinander passieren dann nur in 1 von 32 Fällen – nach fünf Treffern ist „reinerbig“ also schon sehr wahrscheinlich. Ganz sicher ist nur der DNA-Test.</p>'})},
 chance:{t:'🎰 Zufall & wenige Eier',f:()=>({html:'<p>Wahrscheinlichkeiten gelten <b>pro Ei</b>. „50 % Enigma“ heißt nicht, dass von zwei Eiern genau eins Enigma wird – jedes Ei würfelt für sich.</p><p>Bei wenigen Eiern schwankt das Ergebnis stark: Drei von drei oder null von drei sind völlig normal. Erst über <b>viele</b> Gelege pendelt es sich bei den Prozenten ein.</p>',
   more:'<p>In der Statistik heißt das <b>Gesetz der großen Zahlen</b>: Wirfst du eine Münze 4-mal, kommt oft 3 : 1 heraus. Wirfst du sie 1.000-mal, landest du sehr nah bei 500 : 500.</p><p>Darum lohnt es sich, ein gutes Paar mehrmals zu verpaaren, statt nach dem ersten Gelege aufzugeben.</p>'})},
 quality:{t:'⭐ Qualität & Linienzucht',f:()=>({html:'<p>Die <b>Sterne</b> zeigen die Qualität eines Tieres: kräftigere Farben, mehr Wert, mehr Punkte auf der Messe.</p><p>Ein Junges liegt meist nahe am <b>Mittelwert der Eltern</b> – mit etwas Streuung nach oben und unten. Wer immer die besten Tiere miteinander verpaart, züchtet Schritt für Schritt schönere Linien.</p>',
   more:'<p>Qualität vererbt sich in der Natur ähnlich wie Körpergröße beim Menschen: Viele Gene wirken zusammen, das Ergebnis streut um den Elternschnitt. Biologen sprechen von einem <i>quantitativen</i> (polygenen) Merkmal – ganz anders als die klaren Morph-Gene.</p><p><b>Tipp:</b> Die erwartete Qualität siehst du beim Verpaaren in der Zucht-Ansicht. Für Linienzucht lohnt es sich, gute Jungtiere zu behalten statt sie zu verkaufen.</p>'})},
 mut:{t:'☄️ Echte Morphs & Spezial-Mutationen',f:()=>({html:'<p>Die Grundformen im Spiel – bei den Geckos <b>Albino, Eclipse, Mack Snow und Enigma</b> – gibt es <b>wirklich</b>. Züchter auf der ganzen Welt kombinieren sie genau so, wie du es hier tust. Auch viele benannte Kombinationen wie <b>Raptor</b> stammen aus der echten Szene.</p>'+(crysOn()||Object.keys(S.mutSeen||{}).length?'<p>Dazu kommen pro Tierart zwei <b>☄️ Spezial-Mutationen</b>, die es nur hier im Spiel gibt. Sie können nur schlüpfen, solange der <b>grüne Kristall</b> im Inkubator liegt – und auch dann nur sehr selten.</p>':'<p>Und dann gibt es da noch … etwas <b>ganz Besonderes</b>, das es so in der Natur nicht gibt. Was genau? Das verrate ich noch nicht. 😉 Nur so viel: Irgendwann wirst du davon hören.</p>'),
   more:'<p><b>Spontanmutationen gibt es auch in der Natur</b> – so ist jeder Morph einmal entstanden: Irgendwann schlüpfte ein Tier mit einer zufälligen Veränderung im Erbgut, und Züchter haben es weitervermehrt.</p><p>Im Spiel kann deshalb gelegentlich ein normales Gen „aus dem Nichts“ auftauchen, das keins der Eltern hatte. Mit dem <b>🧪 Mutations-Elixier</b> und der <b>UV-Speziallampe</b> erhöhst du die Chance.</p>'})}
};
const LESSON_ORDER=['genes','het','p66','test','dom','chance','quality','mut'];
function lessonBody(k,t,open){const L=LESSON[k].f(t);return L.html+(open?`<div class="tmore">${L.more}</div>`:'')}
const tMoreBtns=(k,next,label)=>S.tut.more===k?[[label||'Alles klar, weiter!',next,'pri']]:[[label||'Verstanden – weiter geht’s!',next,'pri'],['🔍 Erklär’s mir bitte genauer','more:'+k,'']];
/* ---------- Vorhersagen ---------- */
const P1O=['🙈 Keins','⚖️ Ungefähr die Hälfte','💯 Alle'];
const tCorrect1=()=>tSt().type==='rec'?0:1;
function tFb1(){const t=tSt(),n=t.name;if(t.type==='rec')return`Kein Junges zeigt Albino. Jedes bekommt von ${n} eine Albino-Kopie (a), von Rudi aber eine normale (+). Mit nur einer Kopie bleibt ein rezessives Gen <b>unsichtbar</b> – die Jungen sind <b>Träger</b>${LV('',' (heterozygot)',' (heterozygot, Aa)')}, kurz: <b>het Albino</b>.`;
  if(t.type==='dom')return`${n} hat eine Enigma-Kopie (E) und eine normale (+). Jedes Junge erbt zufällig eine davon – wie ein Münzwurf. Bei dominanten Genen reicht <b>eine</b> Kopie, also zeigt im Schnitt <b>jedes zweite</b> Junge Enigma.`;
  return`${n} hat eine Snow-Kopie (S) und eine normale (+). Jedes Junge erbt zufällig eine davon – wie ein Münzwurf. Eine Kopie ergibt Mack Snow, also im Schnitt <b>jedes zweite</b> Junge. Erben Junge von <b>beiden</b> Eltern eine Kopie, entsteht die <b>Super Snow</b> – merk dir das für später!`}
function punnett1(){const t=tSt(),s=t.sym;if(t.type==='rec')return punnett(['+','+'],[s,s],()=>({t:'normal · het',v:0}));
  return punnett(['+','+'],[s,'+'],(x,y)=>x===s||y===s?{t:t.morph,v:1}:{t:'normal',v:0})}
const P2O=['🔍 Rudi trägt Eclipse (het)','🎲 Gar nichts – reiner Zufall','🌑 Rudi ist selbst Eclipse'];
function punnett2(){return punnett(['+','e?'],['e','e'],(x,y)=>x==='e?'?{t:'Eclipse*',v:1}:{t:'normal · het',v:0},'* nur, wenn Rudi wirklich het Eclipse ist')}
function tAnswerHTML(i,ok,opts,win){return`<div class="tq">${opts.map((o,k)=>`<div class="tqo ${k===ok?'ok':''} ${k===i&&k!==ok?'no':''}">${o}</div>`).join('')}</div><p class="tqq">${i===ok?`🎉 <b>Volltreffer!</b>${win?' Wettgewinn: <b>+25 🪙</b>':''}`:'😅 <b>Knapp daneben</b> – macht nichts, selbst alte Hasen verschätzen sich mal!'}</p>`}
function tBet(k){if(S.tut['w'+k])return;S.tut['w'+k]=1;S.coins+=25;S.stats.earned+=25;snd('coin')}
/* ---------- Schlupf-Bildschirm ---------- */
const RVP=[['.rv-name','Zuerst das Wichtigste: der <b>Morph</b> – so heißt die Farbform dieses Jungtiers. Darüber steht die <b>Seltenheit</b>, von Gewöhnlich bis Mythisch.'],['.rv-top','⭐ Ganz oben: die <b>Qualität</b> in Sternen. Je mehr Sterne, desto <b>kräftiger die Farben</b> – und desto wertvoller das Tier. Darunter zum Vergleich deine bisher beste Qualität dieses Morphs.'],['.rv-sub','Darunter Art, Geschlecht, Name und <b>Generation</b> – und was das Tier verdeckt trägt (het).'],['.ribbons','Bunte <b>Bänder</b> melden Besonderes: neu im Atlas, Mutationen, erreichte Zuchtziele …'],['.rv-btns','Zum Schluss: <b>behalten oder verkaufen</b>. Die Kleinen hier behältst du – eins davon wartet schon auf eine Käuferin!']];

function tutStep(){return S.tut?TSTEP[S.tut.s]:null}
const ACK=['Wunderbar – dann fangen wir ganz vorne an, ganz ohne Fachchinesisch.','Prima! Dann frischen wir das auf, und ich sag dir jeweils, wie es im Biobuch heißt.','Ah, ein Kollege! Dann halte ich mich kurz, und wir reden Klartext.'];
const TSTEP={
 welcome:{modal:()=>`<p>Moin! Ich bin <b>Alfred</b>. Über 40 Jahre habe ich hier Leopardgeckos gezüchtet – jetzt will mein Rücken in Rente.</p><p>Ab heute gehört die Station <b>dir</b>. Ich zeig dir noch das Wichtigste – mit echten Eiern statt Vortrag.</p>`,
   btns:()=>[['Los geht’s!','next:level','pri'],['Ich kenne mich aus – überspringen','skip','']]},
 level:{modal:()=>`<p class="tqq">Sag mal, <b>wie fit bist du in Sachen Vererbung?</b> Dann weiß ich, wie ich’s dir erkläre.</p><div class="tq">
   <button class="tqo" data-act="tut" data-v="lvl:0">🌱 <b>Ganz frisch dabei</b><small>Gene, Allele, dominant? Klingt nach Bahnhof – erklär mir alles von vorn.</small></button>
   <button class="tqo" data-act="tut" data-v="lvl:1">📘 <b>Schulwissen</b><small>Dominant, rezessiv, Mendel – hab ich schon mal gehört.</small></button>
   <button class="tqo" data-act="tut" data-v="lvl:2">🧬 <b>Ziemlich fit</b><small>Genotyp, Phänotyp, Allel, homozygot, heterozygot, Punnett-Quadrat – alles klar.</small></button></div><p class="hint">Keine Sorge: Du kannst mich später jederzeit anrufen und dir alles nochmal erklären lassen.</p>`,btns:()=>[]},
 rudi:{modal:()=>`<p class="ack">${ACK[GL()]}</p>`+tPetHTML(tA('rudi'),'Leopardgecko · sieht normal aus')+`<p>Das ist <b>Rudi</b>, mein alter Begleiter. Gekauft vor Jahren auf einer Börse. Der Händler meinte, er <b>könnte</b> ein verstecktes Gen tragen: <b>Eclipse</b>. 50 : 50 – bewiesen hat das nie jemand.</p><p>Merk dir das, wir kommen darauf zurück. 😉</p>`,
   btns:()=>[['Weiter','next:choose','pri']]},
 choose:{wide:1,modal:()=>S.tut.fixed&&TUT_ST[S.tut.fixed]?(t=>`<p>Rudi braucht eine Partnerin – und du weißt ja noch, wen du damals gewählt hast:</p><div class="tut-cards"><button class="tut-card" data-act="tut" data-v="pick:${S.tut.fixed}"><img src="${keyImg('gecko',t.sts,240,180)}"><div><b><span class="sex f">♀</span> ${t.name} · ${t.morph}</b><span class="tt t-${t.type}">${TYPE_DE[t.type]}</span><small>${t.line}</small></div></button></div>`)(TUT_ST[S.tut.fixed]):`<p>Rudi braucht eine Partnerin. Drei Damen hab ich noch – <b>such dir eine aus</b>. Sie wird dein erstes eigenes Zuchttier.</p><div class="tut-cards">${Object.entries(TUT_ST).map(([k,t])=>`<button class="tut-card" data-act="tut" data-v="pick:${k}"><img src="${keyImg('gecko',t.sts,240,180)}"><div><b><span class="sex f">♀</span> ${t.name} · ${t.morph}</b><span class="tt t-${t.type}">${TYPE_DE[t.type]}</span><small>${t.line}</small></div></button>`).join('')}</div>`,btns:()=>[]},
 genes:{modal:()=>{const t=tSt();return tPetHTML(tA('star'),`${t.morph} · ${TYPE_DE[t.type]}`)+`<p>Gute Wahl! ${LV('Eine Sache musst du wissen, dann geht’s los:','Kurz das Wichtigste, dann geht’s los:','Zur Einordnung:')}</p>`+lessonBody('genes',t,S.tut.more==='genes')},
   btns:()=>tMoreBtns('genes','next:pick')},
 pick:{enter:()=>{S.pair={sp:'gecko',m:null,f:null};S.tut.bred0=S.stats.bred},
   text:()=>S.tab!=='brut'?'Ab in die <b>Zucht</b>! Tippe unten auf 🥚.':`Wähle <b>Rudi</b> als ♂ und <b>${tSt().name}</b> als ♀.`,
   target:()=>{if(S.tab!=='brut'&&sheetOpen!=='pick')return NAVT('brut');const sx=S.pair.m!==S.tut.rudi?'m':'f';if(sheetOpen)return`[data-act="setmate"][data-id="${sx==='m'?S.tut.rudi:S.tut.star}"]`;return`[data-act="pickmate"][data-sex="${sx}"]`},
   when:()=>S.pair.m===S.tut.rudi&&S.pair.f===S.tut.star&&!sheetOpen,next:'predict'},
 predict:{modal:()=>{const t=tSt(),a=S.tut.a1;const q=`<div class="bet">🎲 Kleine Wette unter Züchtern!</div><p class="tqq">Was tippst du: Wie viele Junge von Rudi × ${t.name} werden <b>${t.morph}</b> zeigen?</p>`;
     if(a==null)return q+`<div class="tq">${P1O.map((o,i)=>`<button class="tqo" data-act="tut" data-v="a1:${i}">${o}</button>`).join('')}</div><p class="hint">Kein Druck – raten ist ausdrücklich erlaubt. Richtig getippt gibt’s 25 🪙.</p>`;
     return q+tAnswerHTML(a,tCorrect1(),P1O,1)+`<p>${tFb1()}</p>`+punnett1()+(S.tut.more==='pgen'?`<div class="tmore">${LESSON.genes.f(t).more}</div>`:'')},
   btns:()=>S.tut.a1==null?[]:tMoreBtns('pgen','next:breed','Ausprobieren – verpaaren!')},
 breed:{text:'Ab jetzt rechnet dir die Zucht-Ansicht so etwas immer aus – siehst du die Prozente? Tippe auf <b>💞 Verpaaren</b>.',
   target:()=>S.tab!=='brut'?NAVT('brut'):'[data-act="breed"]',when:()=>S.stats.bred>S.tut.bred0,next:'tiere'},
 tiere:{text:'Die Eier brauchen knapp eine Minute. Zeit für eine Runde durch die Station: Tippe unten auf <b>Terrarien</b>.',target:NAVT('tiere'),when:()=>S.tab==='tiere',next:'hetintro'},
 hetintro:{text:()=>`Hier wohnen deine Tiere. Schau mal auf Rudis Karte: „<b>50 % het Eclipse</b>“. Was heißt das eigentlich?`,target:()=>S.tab==='tiere'?`.card[data-id="${S.tut.rudi}"]`:NAVT('tiere'),btn:'Erklär’s mir!',next:'hetinfo'},
 filter:{text:'Wenn es hier voller wird, helfen dir Filter. Tippe auf <b>Filter</b>.',target:()=>S.tab!=='tiere'?NAVT('tiere'):'[data-act="fopen"]',when:()=>S.tab==='tiere'&&S.ui.fopen,next:'filter2'},
 filter2:{text:'Tippe ein Gen mehrmals an: <b>sichtbar → het → möglich het → ohne</b>. Daneben kannst du <b>sortieren</b> – etwa nach Morph oder Qualität.',target:'.fpanel',btn:'Und was heißt „möglich het“?',next:'hetinfo'},

/* ================= Reinerbigkeit dominanter Gene ================= */
const domGenes=sp=>SPECIES[sp].genes.filter(g=>g.type==='dom');
function hpOf(a,g){if(!a||!st(a,g))return 0;const v=(a.hp||{})[g.id];return v==null?0:v}
function passD(a,g){return a&&st(a,g)?.5+.5*hpOf(a,g):0}
function hpFromDq(a,dq){a.hp={};domGenes(a.sp).forEach(g=>{if(!st(a,g))return;const d=(dq||{})[g.id];if(!d){a.hp[g.id]=0;return}const vis=1-(1-d[0])*(1-d[1]);a.hp[g.id]=vis>1e-9?d[0]*d[1]/vis:0})}
function hpEvidence(kid,egg,inf){domGenes(kid.sp).forEach(g=>{const d=(egg.dq||{})[g.id];if(!d)return;const vis=!!st(kid,g);egg.parents.forEach((pid,i)=>{const par=byId(pid);if(!par||!st(par,g))return;const h=hpOf(par,g);if(h<=0||h>=1)return;par.hp=par.hp||{};par.hev=par.hev||{};
  if(!vis){par.hp[g.id]=0;par.hev[g.id]=-1;inf.push(`${esc(par.name)} ist sicher mischerbig ${g.name}`)}else{const qo=d[1-i],L=1-.5*(1-qo),E=par.hev[g.id];par.hev[g.id]=E==null?L:E*L;const ap=hpApply(par,g.id);par.hp[g.id]=ap!=null?ap:h/(h+(1-h)*L)}
  hpDown(par,g,0)})})}
/* 7.7: Reinerbig-Wissen. a.dq = Weitergabe-Chancen der Eltern (aktuell), a.hev = eigene Belege: Faktor >0, 0 = sicher reinerbig, -1 = sicher mischerbig */
function hpBase(a,gid){const d=a.dq&&a.dq[gid];if(!d)return null;const vis=1-(1-d[0])*(1-d[1]);return vis>1e-9?d[0]*d[1]/vis:0}
function hpApply(a,gid){const b=hpBase(a,gid);if(b==null)return null;const E=a.hev&&a.hev[gid];if(E==null)return b;if(E<0)return 0;if(E===0)return 1;return b>0?b/(b+(1-b)*E):0}
const isMutGene=(a,gid)=>!!(a.orig&&a.orig[gid]&&String(a.orig[gid]).includes('x'));
function hpDown(par,g,depth){depth=depth||0;if(depth>8)return;childrenOf(par).forEach(c=>{if(c.sp!==par.sp||!st(c,g)||!c.dq||!c.dq[g.id]||isMutGene(c,g.id))return;const i=c.parents.indexOf(par.id);if(i<0)return;c.dq[g.id][i]=passD(par,g);const old=hpOf(c,g),nv=hpApply(c,g.id);c.hp=c.hp||{};c.hp[g.id]=nv;if(Math.abs(nv-old)>.001){if(KCH)KCH.add(c.id);hpDown(c,g,depth+1)}})}
/* Beim Schlupf: Het- und Reinerbig-Wissen aus dem AKTUELLEN Wissen über die Eltern bilden (nicht vom Legezeitpunkt) */
function hatchKnow(a,egg){const pm=byId(egg.parents[0]),pf=byId(egg.parents[1]);
  if(pm&&pf){a.pq=a.pq||{};SPECIES[a.sp].genes.forEach(g=>{if(g.type!=='rec'||st(a,g)||(a.pk&&a.pk[g.id])||g.id===egg.mut||g.id===egg.mutN)return;a.pq[g.id]=[parentQ(pm,g.id),parentQ(pf,g.id)];recalcFromParents(a,g.id)});
    const dq=Object.assign({},egg.dq||{});domGenes(a.sp).forEach(g=>{if(g.id===egg.mut||g.id===egg.mutN)return;dq[g.id]=[passD(pm,g),passD(pf,g)]});egg.dq=dq}
  a.dq=JSON.parse(JSON.stringify(egg.dq||{}));hpFromDq(a,a.dq)}
/* Migration 7.7: Wissen von Tieren mit zwei lebenden Eltern auffrischen (nach Kennung aufsteigend). a.ev bleibt; Reinerbig-Werte bleiben gleich, bekommen aber dq/hev für künftige Weitergabe. */
function geneMigrate77(){S.animals.slice().sort((x,y)=>x.id-y.id).forEach(a=>{const ps=(a.parents||[]).map(byId);if(ps.length!==2||!ps[0]||!ps[1])return;
  SPECIES[a.sp].genes.forEach(g=>{if(g.type!=='rec'||st(a,g)||(a.pk&&a.pk[g.id])||isMutGene(a,g.id))return;a.pq=a.pq||{};a.pq[g.id]=[parentQ(ps[0],g.id),parentQ(ps[1],g.id)];recalcFromParents(a,g.id)});
  if(!a.dq){a.dq={};domGenes(a.sp).forEach(g=>{if(!st(a,g)||isMutGene(a,g.id))return;a.dq[g.id]=[passD(ps[0],g),passD(ps[1],g)];const b=hpBase(a,g.id),h=hpOf(a,g);if(b>1e-6&&b<1-1e-6){a.hev=a.hev||{};a.hev[g.id]=h<=0?-1:h>=1?0:(b*(1-h))/(h*(1-b))}})}})}
function hpMigrate(){S.animals.slice().sort((x,y)=>x.id-y.id).forEach(a=>{if(a.hp)return;a.hp={};domGenes(a.sp).forEach(g=>{if(!st(a,g))return;const ps=(a.parents||[]).map(byId);if(ps.length===2&&ps[0]&&ps[1]){const pm=passD(ps[0],g),pf=passD(ps[1],g),vis=1-(1-pm)*(1-pf);a.hp[g.id]=vis>1e-9?pm*pf/vis:0}else a.hp[g.id]=a.parents?1/3:0})})}
function domTests(){const out=[];S.animals.forEach(a=>domGenes(a.sp).forEach(g=>{const h=hpOf(a,g);if(h>.05&&h<.95)out.push({a,g,h})}));return out.sort((x,y)=>Math.abs(.5-x.h)-Math.abs(.5-y.h))}

/* ================= 7.7 Selbsttest (?selftest=1) – eigener Zustand, eigene Speicher-Schlüssel ================= */
function runSelftest(){BOOTED=true;
  const box=document.createElement('div');box.id='selftest';box.innerHTML=`<div class="rs"><div style="font-size:40px">🧪</div><h1>Reptilia – Selbsttest</h1><div>Version ${VERSION} · Prüflauf startet …</div></div>`;document.body.appendChild(box);
  setTimeout(()=>{let R=[];try{R=selftestRun()}catch(e){R=[{n:'Selbsttest abgebrochen',ok:false,info:e.message}];logErr(e,'Selbsttest')}selftestShow(box,R)},60)}
function selftestRun(){const R=[],ok=(n,c,info)=>R.push({n,ok:!!c,info:info==null?'':String(info)});
  const REAL='reptilia_save_v2';let realBefore=null,realBak=null;try{realBefore=localStorage.getItem(REAL);realBak=localStorage.getItem(REAL+'_bak')}catch(e){}
  const T=(n,fn)=>{try{fn()}catch(e){ok(n,false,'Fehler: '+e.message)}};
  const sandbox=()=>{RQ=[];BATCH=null;S=defaults();S.tut=null;S.intro=true;S.sound=false;S.stats.tutDone=1;S.daily.last=new Date().toDateString();S.unl=SP_ORDER.slice();S.lvl=10;S.bkRemind=Date.now();S.crys={have:0}};
  const mk=(sex,g,o)=>{const a=newAnimal('gecko',Object.assign({sex,g:g||{},adult:true},o||{}));a.hp=a.hp||{};S.animals.push(a);return a};
  const hatch=e=>{e.ready=Date.now()-1;S.eggs.push(e);RQ=[e.id];BATCH=null;nextReveal();closeReveal();RQ=[]};
  const kidOf=e=>S.animals.find(a=>a.seed===e.seed);
  const near=(x,p,t)=>Math.abs(x-p)<=t;
  // 1) Mendel-Verhältnisse aus je 10.000 Eiern
  T('Mendel',()=>{sandbox();const N=10000,m=mk('m',{tremper:1,snow:1,enigma:1},{p:{tremper:1}}),f=mk('f',{tremper:1,snow:1,enigma:1},{p:{tremper:1}});let rec=0,c=[0,0,0],dom=0;
    for(let i=0;i<N;i++){const e=makeEgg(m,f,-1);if((e.g.tremper||0)===2)rec++;c[e.g.snow||0]++;if(e.g.enigma)dom++}
    ok('Mendel rezessiv (Albino): het × het → 25 % sichtbar',near(rec/N,.25,.02),(rec/N*100).toFixed(1)+' %');
    ok('Mendel ko-dominant (Mack Snow): 25 / 50 / 25 %',near(c[0]/N,.25,.02)&&near(c[1]/N,.5,.02)&&near(c[2]/N,.25,.02),c.map(x=>(x/N*100).toFixed(1)).join(' / ')+' %');
    ok('Mendel dominant (Enigma): het × het → 75 % sichtbar',near(dom/N,.75,.02),(dom/N*100).toFixed(1)+' %');
    const d=geneDist(m,f,geneOf('gecko','tremper'));ok('Vorhersage passt zu Mendel (rezessiv 25 %)',near(d[1],.25,1e-9),(d[1]*100).toFixed(1)+' %')});
  // 2) predict summiert sich zu 1
  T('predict',()=>{sandbox();let worst=0;for(let k=0;k<60;k++){const sp=pick(SP_ORDER),rg=()=>{const g={},p={},hp={};SPECIES[sp].genes.forEach(x=>{const c=ri(0,2);if(c)g[x.id]=c;if(x.type==='rec'&&c<2&&rand()<.5)p[x.id]=+rand().toFixed(2);if(x.type==='dom'&&c)hp[x.id]=+rand().toFixed(2)});return{g,p,hp}};
      const A=rg(),B=rg(),m=newAnimal(sp,{sex:'m',g:A.g,p:A.p}),f=newAnimal(sp,{sex:'f',g:B.g,p:B.p});m.hp=A.hp;f.hp=B.hp;const s=predict(m,f).reduce((t,r)=>t+r.pr,0);worst=Math.max(worst,Math.abs(1-s))}
    ok('Vorhersage: Summe aller Ergebnisse = 100 % (60 Zufallspaare)',worst<1e-4,'größte Abweichung '+worst.toExponential(1))});
  // 3) Fall A (2.1) in beiden Reihenfolgen
  const caseA=albFirst=>{sandbox();const dad=mk('m',{tremper:1},{p:{tremper:.5}}),mom=mk('f',{tremper:1},{p:{tremper:1}});mom.pk={tremper:1};
    const eA=makeEgg(dad,mom,-1),eN=makeEgg(dad,mom,-1);eA.g=Object.assign({},eA.g,{tremper:2});eA.orig=Object.assign({},eA.orig,{tremper:'mf'});eN.g=Object.assign({},eN.g);delete eN.g.tremper;eN.orig=Object.assign({},eN.orig);delete eN.orig.tremper;
    if(albFirst){hatch(eA);hatch(eN)}else{hatch(eN);hatch(eA)}return Math.round((kidOf(eN).p.tremper||0)*100)};
  T('Fall A',()=>{const a=caseA(true),b=caseA(false);ok('Fall A: Albino zuerst → unauffälliges Geschwister 67 % het',a===67,a+' %');ok('Fall A: Unauffälliges zuerst → 67 % het',b===67,b+' %')});
  // 4) Fall B (2.2) in beiden Reihenfolgen
  const caseB=yesFirst=>{sandbox();const dad=mk('m',{enigma:1}),mom=mk('f',{enigma:1});dad.hp={enigma:1/3};mom.hp={enigma:1/3};
    const eY=makeEgg(dad,mom,-1),eN=makeEgg(dad,mom,-1);eY.g=Object.assign({},eY.g,{enigma:1});eY.orig=Object.assign({},eY.orig,{enigma:'m'});eN.g=Object.assign({},eN.g);delete eN.g.enigma;eN.orig=Object.assign({},eN.orig);delete eN.orig.enigma;
    if(yesFirst){hatch(eY);hatch(eN)}else{hatch(eN);hatch(eY)}return Math.round(hpOf(kidOf(eY),geneOf('gecko','enigma'))*100)};
  T('Fall B',()=>{const a=caseB(true),b=caseB(false);ok('Fall B: Enigma-Jungtier zuerst → 33 % reinerbig',a===33,a+' %');ok('Fall B: Jungtier ohne Enigma zuerst → 33 % reinerbig',b===33,b+' %')});
  // 5) Migration 7.7 frischt veraltetes Het-Wissen auf
  T('Migration',()=>{sandbox();const dad=mk('m',{tremper:1},{p:{tremper:1}}),mom=mk('f',{tremper:1},{p:{tremper:1}});dad.pk={tremper:1};mom.pk={tremper:1};const kid=mk('m',{},{p:{tremper:.571},parents:[dad.id,mom.id]});kid.pq={tremper:[.25,.5]};
    geneMigrate77();ok('Migration: veraltetes 57 % wird 67 %',Math.round(kid.p.tremper*100)===67,Math.round(kid.p.tremper*100)+' %')});
  // 6) DNA-Test gegen das wahre Erbgut
  T('DNA',()=>{sandbox();S.coins=1e9;let bad=0,n=0;for(let k=0;k<40;k++){const g={},p={};SPECIES.gecko.genes.forEach(x=>{if(x.mut)return;const c=ri(0,2);if(c)g[x.id]=c;if(x.type==='rec'&&c<2)p[x.id]=.5});const a=mk(k%2?'m':'f',g,{p});a.hp={};domGenes('gecko').forEach(x=>{if(st(a,x))a.hp[x.id]=.5});
      const el=document.createElement('button');el.dataset.armed='1';ACT.dna({id:String(a.id)},el);closeSheet();
      SPECIES.gecko.genes.forEach(x=>{if(x.mut)return;n++;const c=a.g[x.id]||0;if(x.type==='rec'&&c<2){if(((a.p[x.id]||0)>=.995)!==(c===1)||!(a.pk||{})[x.id])bad++}if(x.type==='dom'&&c){if((hpOf(a,x)>=.995)!==(c===2))bad++}})}
    ok('DNA-Test stimmt mit dem wahren Erbgut überein (40 Tiere)',bad===0,bad?bad+' Abweichungen':n+' Gene geprüft')});
  // 7) Namen bleiben + Speichern/Laden
  T('Speichern',()=>{sandbox();const fn=[...NAMESET_F][0],mn=[...NAMESET_M][0];const a=mk('m',{},{name:fn}),b=mk('f',{tremper:1,snow:2},{name:mn,p:{eclipse:.33}});const e=makeEgg(a,b,-1);S.eggs.push(e);S.coins=1234;registerAtlas(b);
    ok('Speichern meldet Erfolg',save()===true);const j1=JSON.stringify({an:S.animals,eg:S.eggs,c:S.coins,at:S.atlas,ach:S.ach,lvl:S.lvl});
    load();ok('Namen bleiben (♂ „'+fn+'“, ♀ „'+mn+'“)',byId(a.id).name===fn&&byId(b.id).name===mn);
    const j2=JSON.stringify({an:S.animals,eg:S.eggs,c:S.coins,at:S.atlas,ach:S.ach,lvl:S.lvl});save();const full1=JSON.stringify(S);load();const full2=JSON.stringify(S);
    ok('Speichern und Laden ergibt denselben Zustand',j1===j2&&full1===full2,j1===j2?(full1===full2?'':'zweiter Durchlauf weicht ab'):'Tiere/Eier/Münzen weichen ab')});
  // 8) eingebettete Alt-Stände
  SELFTEST_SAVES.forEach(([name,raw])=>T('Alt-Stand '+name,()=>{const d=JSON.parse(raw);localStorage.setItem(SAVE_KEY,raw);RQ=[];BATCH=null;load(true);checkUnlock();fillOrders();if(!S.shop.offers.length)refreshShop();if(!trendActive())newTrend();render();
    ok('Alt-Stand '+name+' lädt fehlerfrei',S.sv===SCHEMA&&S.animals.length===d.animals.length&&Math.floor(S.coins)===Math.floor(d.coins)&&validateSave(S)==='',`${S.animals.length} Tiere, ${fmt(S.coins)} 🪙, Ziele erledigt: ${Object.keys(S.goalDone||{}).length}`)}));
  // aufräumen + echter Stand unverändert
  try{Object.keys(localStorage).filter(k=>k.startsWith('reptilia_selftest')).forEach(k=>localStorage.removeItem(k))}catch(e){}
  let realAfter=null,bakAfter=null;try{realAfter=localStorage.getItem(REAL);bakAfter=localStorage.getItem(REAL+'_bak')}catch(e){}

/* ================= 7.8 Zurück-Taste ================= */
/* Einträge im Verlauf = offene Ebenen (Schlupf, Fenster-Stapel, Tutorial-Karte) + Wächter. Zurück schließt die oberste Ebene; auf der Hauptseite erst Hinweis, beim zweiten Mal verlassen. */
let HN=0,HG=1,HIGN=false,HACT=false,HSYNC=0,EXITARM=0,TUTMIN='';
const coachCardOn=()=>{const m=$('#coachm');return!!(m&&m.classList.contains('show'))};
const histLayers=()=>(revealOn()?1:0)+(sheetOpen?SHSTACK.length+1:0)+(coachCardOn()?1:0);
function histSync(){if(!BOOTED||SELFTEST||RESCUE)return;clearTimeout(HSYNC);HSYNC=setTimeout(histDo,0)}
function histDo(){if(HIGN||(EXITARM&&Date.now()-EXITARM<4000))return;EXITARM=0;const D=histLayers()+HG;try{if(HN<D){while(HN<D){HN++;history.pushState({rp:HN},'')}}else if(HN>D){HIGN=true;const k=D-HN;HN=D;setTimeout(()=>{HIGN=false},1500);history.go(k)}}catch(e){}}
function backReveal(){const R=$('#reveal');if(S.tut)return;if(!R.classList.contains('open'))R.click();const k=R.querySelector('[data-act=keep]');if(k)ACT.keep();else closeReveal()}
function handleBack(){if(RESCUE)return;
  if(revealOn()){backReveal();return}
  if(sheetOpen){sheetBack();return}
  if(coachCardOn()&&S.tut){TUTMIN=S.tut.s;tutPaint();return}
  if(EXITARM&&Date.now()-EXITARM<4000){EXITARM=0;save();try{history.go(-(HN+1))}catch(e){}return}
  EXITARM=Date.now();toast('↩️ Nochmal <b>Zurück</b> zum Verlassen','',3000)}
addEventListener('popstate',e=>{const n=(e.state&&e.state.rp)||0;if(HIGN){HIGN=false;HN=n;return}if(!BOOTED||SELFTEST)return;HN=n;handleBack();histSync()});
/* ================= Boot ================= */
function boot(){
  if(SELFTEST){runSelftest();return}
  if(/[?&]rescue=1(&|$)/.test(location.search)){rescueScreen(new Error('Testansicht über ?rescue=1 – hier ist nichts kaputt.'),true);return}
  addEventListener('storage',e=>{if(e.key===LOCK_KEY&&e.newValue&&e.newValue!==SID)goPassive()});
  try{
    claimLock();
    load();checkUnlock();fillOrders();if(!S.shop.offers.length)refreshShop();if(!trendActive())newTrend();
    render();lastSig=sig();
    document.body.classList.toggle('bigfont',!!S.bigfont);if(S.tut||!S.intro)S.seenVer=VERSION;else if(S.seenVer!==VERSION){mail('🆕',`Update auf Version ${VERSION}`,'Tippen, um zu sehen, was neu ist','clog');}if(S.intro&&!S.tut&&S.seenVer!==VERSION)setTimeout(()=>toast(`🆕 <b>Version ${VERSION}</b> – tippe hier, um zu sehen, was neu ist`,'gold',9000,changelogSheet),1200);if(S.tut)tutPaint();else if(!S.intro)introSheet();else daily();
  }catch(err){logErr(err,'Start');rescueScreen(err);return}
  BOOTED=true;
  setInterval(tick,500);setInterval(()=>{if(DIRTY)save()},5000);
  addEventListener('visibilitychange',()=>{if(document.hidden)save();else liveUpdate()});
  addEventListener('pagehide',()=>save());
  try{history.replaceState({rp:0},'')}catch(e){}HN=0;histSync();
  setInterval(tutPaint,400);
}
boot();
